c transport aircraft above 2300Kg.","b":"All public transport aircraft above 5700Kg.","c":"All aircraft registered in the UK.","correct":["C"],"e":"Nil.","img":false},{"s":"10.1. Regulatory Framework.","n":"3","q":"A Part-145 approval covers","a":"base maintenance.","b":"the major part of the organisation.","c":"only line maintenance.","correct":["A"],"e":"The part-145 organisation covers ALL of the organisation, and not only line maintenance.","img":false},{"s":"10.1. Regulatory Framework.","n":"4","q":"For UK registered aircraft, components must be","a":"maintained by a part-145 approved organisation.","b":"any appropriately approved organisation.","c":"maintained by a part-145 approved organisation registered in the UK.","correct":["B","C"],"e":"The question is not specific about the 'type' of aircraft (light or heavy).","img":false},{"s":"10.1. Regulatory Framework.","n":"5","q":"Aircraft manufactured abroad, but registered in the UK","a":"can fly with an export C of A.","b":"must have a C of A issued in the UK before it can fly.","c":"can fly with a foreign C of A.","correct":["C"],"e":"It can fly with a foreign C of A providing it is issued a CAA validation certificate.","img":false},{"s":"10.1. Regulatory Framework.","n":"6","q":"To facilitate a repair, a drawing can be taken from","a":"the CAA.","b":"the manufacturer.","c":"a part-145 organisation.","correct":["B"],"e":"The drawing must come from an organisation with Design Approval. Only the manufacturer automatically has that.","img":true},{"s":"10.1. Regulatory Framework.","n":"7","q":"Documents to be carried on a specific aircraft for a specific purpose is given in","a":"BCAR Section A and B.","b":"JAR-OPS.","c":"AOC.","correct":["B"],"e":"Nil.","img":false},{"s":"10.1. Regulatory Framework.","n":"8","q":"Safe operation of the aircraft is the responsibility of the","a":"part-M organisation.","b":"owner.","c":"operator.","correct":["C"],"e":"That's the purpose of the Air Operator's Certificate (AOC).","img":false},{"s":"10.1. Regulatory Framework.","n":"9","q":"The period of validity of a Certificate of Fitness for Flight under 'A' Conditions is","a":"7 days.","b":"1 flight.","c":"2 days.","correct":["A"],"e":"BCAR Section A/B3-8.","img":false},{"s":"10.1. Regulatory Framework.","n":"10","q":"The details of design of a particular aircraft can be found where","a":"The Maintenance Manual.","b":"The Declaration of Design and Performance.","c":"EASA Certification Specification 25.","correct":["B"],"e":"Nil.","img":false},{"s":"10.1. Regulatory Framework.","n":"11","q":"The validity of an EASA permit to fly is","a":"12 months.","b":"7 days.","c":"as stated on the certificate but not exceeding 14 days.","correct":["C"],"e":"AWN 9 Para.5. 10.2. Part-66 - Certifying Staff - Maintenance.","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"1","q":"An engineer may issue a CRS if they","a":"have a company approval.","b":"are LWTR and company approved on the appropriate type of aircraft.","c":"are type rated on any equivalent aircraft type.","correct":["B"],"e":"AWN 3.","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"2","q":"Where would you normally train for licences","a":"At a Part-147 approved organisation.","b":"At a Part-145 approved organisation.","c":"At a technical training school.","correct":["A"],"e":"Part-147 is approval for training organisations (both basic and type training).","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"3","q":"By when do BCAR licensed aircraft maintenance engineers have to conform to EASA Part-66","a":"28th September 2011.","b":"28th September 2006.","c":"28th September 2001.","correct":["B"],"e":"AWN 7 Para. 15.","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"4","q":"By what date must all base maintenance certifying staff and B1 and B2 support staff for aircraft below 5700kg be part-66 qualified","a":"28 September 2008.","b":"28 September 2006.","c":"currently there is no date specified, such authorisations will always be covered by BCAR Section L.","correct":["A","C"],"e":"NIL.","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"5","q":"If changes are made in a Part-66 license without the approval of the CAA","a":"the license is cancelled and an enquiry is conducted.","b":"the license is cancelled from the point of the CAA becoming aware of the changes.","c":"all certifications made under that licence are invalid from the date the changes were made.","correct":["C"],"e":"66.A.40 (b).","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"6","q":"If an engineer has a heavy cold, he/she","a":"must take only the medication which is prescribed specifically to him/her.","b":"may take medication without advice.","c":"must seek medical advice from a doctor.","correct":["A"],"e":"AWN 47 Para.3.7.","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"7","q":"To what does a B1-3 License apply to","a":"Helicopter with turbines, their engines, airframes and electrics.","b":"Light aircraft with piston engines.","c":"Helicopters with piston engines, their engines, airframes and electrics.","correct":["A"],"e":"66.A.1 (b) and ELGD A5.2.","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"8","q":"What can an A1 licensed engineer sign for","a":"Minor Scheduled Line Maintenance tasks on turbine engined helicopters.","b":"Minor Scheduled Line Maintenance tasks on turbine engined aircraft.","c":"Minor Scheduled Line Maintenance tasks on piston engined aircraft.","correct":["C"],"e":"66.A.1 (a) and ELGD A5.1.","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"9","q":"Who can sign a CRS","a":"Any licensed engineer.","b":"An appropriately licensed engineer.","c":"An unlicensed engineer who has permission from the Chief Inspector.","correct":["B"],"e":"66.A.20, and 145.A.50.","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"10","q":"Where would you find the requirements and the syllabus for a maintenance license","a":"EASA Part-147.","b":"EASA Part-145.","c":"EASA Part-66.","correct":["C"],"e":"See Part-66.","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"11","q":"An A1 licensed mechanic can sign for","a":"Aeroplanes and Helicopters.","b":"Aeroplanes - Piston.","c":"Aeroplanes - Turbine.","correct":["C"],"e":"66.A.1.","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"12","q":"From 28 September 2008, all engineers are required to be licensed in accordance with","a":"EASA Part-66.","b":"ICAO.","c":"JAR 66.","correct":["A"],"e":"AWN 7 App.1 para 4.","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"13","q":"A Part-66 licence can be used without amendment or exchange","a":"only in the member state in which it was issued.","b":"throughout all member states.","c":"throughout the World.","correct":["B"],"e":"EASA Part-66 Appendix V para 10.","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"14","q":"A part-66 licence holder wishing to work in another member state apart from the one it was issued, must have a licence printed in","a":"English.","b":"only the originating member state's language.","c":"the language of the member state which the holder wishes to work in.","correct":["C"],"e":"NIL.","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"16","q":"Who issues a part-66 licence","a":"EASA.","b":"A part 145 organisation.","c":"The competent authority of the member state.","correct":["C"],"e":"EASA Part-66 Appendix V para 6.","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"17","q":"Who may amend or endorse a part-66 licence","a":"A part 145 organisation.","b":"The licence holder.","c":"A part 147 organisation.","correct":["A"],"e":"EASA Part-66 Appendix V para 7.","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"18","q":"Whose responsibility is it that no unauthorised entries are made in a part-66 licence","a":"EASA or the national aviation authority of the member state.","b":"The licence holder.","c":"The part-145 organisation.","correct":["B"],"e":"EASA Part-66 Appendix V para 8.","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"19","q":"EASA Form 26 is","a":"the application for a part-66 licence.","b":"the application for an extension to a part-66 licence.","c":"the part-66 licence itself.","correct":["C"],"e":"EASA Part-66 Appendix V Page 150.","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"20","q":"A part-66 licence is issued for","a":"initially 2 years then re-issued for a period of 5 years.","b":"initially 5 years then re-issued for a period of 2 years.","c":"5 years.","correct":["A","C"],"e":"NIL.","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"21","q":"A B2 License applies to","a":"line maintenance on airframe structure and powerplants.","b":"line maintenance on electrical systems and avionics.","c":"line maintenance on airframe structure.","correct":["B"],"e":"66.A.20 para (a) 3.","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"22","q":"What does a B1-3 approval apply to","a":"Light Aircraft with Piston Engines.","b":"Helicopters with Turbine Engines, airframe and electrics.","c":"Helicopters with Piston Engines, airframe and electrics.","correct":["B"],"e":"66.A.1 (b).","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"23","q":"A Part-66 maintenance license remains valid","a":"if he/she has received continuation training in the last 2 years.","b":"if he/she has worked on aircraft for 6 months in the last 2 years.","c":"if he/she has worked on aircraft for 4 months in the last 2 years.","correct":["B"],"e":"145.A.35 para (c).","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"24","q":"A category A licence","a":"is automatically issued with a category B1 licence.","b":"is automatically issued with a category B2 licence.","c":"is automatically issued with both a category B1 and B2 licence.","correct":["A"],"e":"66.A.20 (a) 2 and 3.","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"25","q":"Who carries out the practical task training required for a category A licence","a":"Either a part-145 or a part-147 organisation.","b":"A part-147 organisation only.","c":"A part-145 organisation only.","correct":["A"],"e":"66.A.45 (a).","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"26","q":"Who is responsible for the control and issue of engineers licenses","a":"EASA.","b":"CAA.","c":"JAA.","correct":["B"],"e":"In the UK only. 66.1.","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"27","q":"When can a LAE sign a CRS","a":"For any aircraft for which he has a type rating.","b":"For any aircraft for which his company has Part-145 approval.","c":"For any aircraft for which he has a type endorsement on his license and holds the appropriate company approval.","correct":["C"],"e":"66.A.45 (b).","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"28","q":"The time scale for retaining training records within a JAR-147 school is","a":"five years after the candidate leaves the course.","b":"three years after the course.","c":"five years after the completion of the course.","correct":["C"],"e":"147.A.125.","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"29","q":"A basic aircraft maintenance in category B1, B2 or C licence","a":"does confer licensing responsibilities.","b":"allows you to sign a CRS but not CMR.","c":"does not confer any licensing responsibilities.","correct":["C"],"e":"66.A.45 (b).","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"30","q":"If an engineer has an aircraft maintenance basic license he/she can","a":"not sign anything, there are no certification rights offered by the license alone.","b":"sign the CRS.","c":"sign the CRS, as the license implies the rights of certification.","correct":["A"],"e":"66.A.45 (b).","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"31","q":"With reference to the licensing of aircraft maintenance engineers, the requirements for the issue of a licence without type rating can be found in","a":"BCAR section L.","b":"EASA IR Part-66.","c":"Airworthiness Notices.","correct":["A"],"e":"BCAR Section L - Note: A Part-66 licence is referred to as a 'Basic Licence', not a 'Licence Without Type Rating'.","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"32","q":"Within an aircraft maintenance organisation approved in accordance with IR Part-145, the limitations of an individual's certification rights are recorded upon","a":"the personnel authorisation certificate.","b":"the aircraft maintenance licence.","c":"the personnel records.","correct":["B"],"e":"Part-66 App. IV pg 151.","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"33","q":"In the future BCAR section L will be replaced by","a":"EASA IR Part-66.","b":"JAA JAR-66.","c":"EASA IR Part-145.","correct":["A"],"e":"AWN 7 App.4.","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"34","q":"The term 'Extension' of a Part-66 licence means","a":"to extend its validity for a further period of time.","b":"to add an additional basic category.","c":"to add a type approval.","correct":["B"],"e":"ELGD Section G.","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"35","q":"A Category-A Part-66 licensed engineer can certify for work carried out","a":"by him/herself only.","b":"by anyone within an approved organisation.","c":"by anyone, even if they are independent of an approved organisation.","correct":["C"],"e":"66.A.20 (a) 1.","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"36","q":"A part-66 licensed engineer must be able to speak","a":"the language of the technical documentation and procedures for the maintenance of the aircraft for which they are certifying.","b":"English.","c":"the language of the European Member State which issued his/her licence.","correct":["A"],"e":"66.A.20 (b) 3.","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"37","q":"An aircraft type approval endorsement to a Part-66 licence is only provided after","a":"adequate theoretical training.","b":"adequate theoretical and practical training.","c":"adequate practical training.","correct":["B"],"e":"66.A.45 (d).","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"38","q":"EASA IR Part-66 applies to aircraft","a":"below 5700 kg only.","b":"above and below 5700 kg.","c":"above 5700 kg only.","correct":["B"],"e":"AWN 46 Para.4.1.","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"39","q":"An engineer's BCAR Section L licence for certification of aircraft above 5700 kg will, on 28 Sept 2006","a":"automatically convert to EASA IR Part-66 without any action.","b":"remain usable but with restrictions if not converted to EASA IR Part-66.","c":"become invalidated if not converted to EASA IR Part-66.","correct":["C"],"e":"AWN 46 Para.1.4.","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"40","q":"In order to obtain a type approval on an aircraft, an engineer must","a":"must work on aircraft for 12 months within the last 24 months.","b":"have a manufacturers course within the last 3 years.","c":"work on the type for 12 months in the last 24 months.","correct":["C"],"e":"66.A.30 (d).","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"41","q":"What experience is required for an A1 license","a":"2 yrs or 1 yr if qualified in another profession.","b":"3 yrs or 2 yrs if qualified in another profession.","c":"5 yrs or 3 yrs if trained by 147 company.","correct":["B"],"e":"66.A.30.","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"42","q":"The syllabus and requirements related to an aircraft maintenance engineers license for a light commercial air transport aircraft can be found in","a":"BCAR Section L.","b":"JAR-66.","c":"IR Part-66.","correct":["C"],"e":"NIL.","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"43","q":"The usual qualification route for a Category C licensed engineer is","a":"3 years experience as a B1.1, B1.3 or B2 engineer.","b":"8 years experience as a B1.1, B1.3 or B2 engineer.","c":"5 years experience as a B1.1, B1.3 or B2 engineer.","correct":["A"],"e":"66.A.30 Para.3.","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"44","q":"An EASA category A licensed mechanic can","a":"certify minor line tasks which he has done himself and for which he has approval.","b":"certify minor line tasks which he or other line mechanics have done and for which he has approval.","c":"certify line maintenance checks.","correct":["A"],"e":"66.A.20 Para.(a) (1).","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"45","q":"The minimum experience for qualification of a B1 or B2 licensed engineer is","a":"4 years reducing to 2 years if trained in a 147 approved organization.","b":"5 years reducing to 3 years if trained in a non-aviation trade.","c":"4 years reducing to 2 years if trained in a non-aviation trade.","correct":["B"],"e":"66.A.30 Para a 2.","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"47","q":"Which of the following are the sub-sections of a Part-66 maintenance licence in category A","a":"Aeroplanes - Piston, helicopters Piston, Aeroplanes -Turbine and Helicopters Turbine.","b":"Aeroplanes - Piston and helicopters Piston.","c":"Aeroplanes - Turbine and helicopters Turbine.","correct":["C"],"e":"66.A.1.(b).","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"48","q":"A Part-66 A licensed engineer can","a":"sign the CRS for minor line maintenance, within the limits of tasks specifically endorsed on the authorisation sign the CRS for minor line maintenance, within the limits of tasks specifically endorsed on the authorisation.","b":"sign the CRS for any line maintenance and defect repairs.","c":"sign the CRS for any minor line repairs as long as they have the aircraft type stamped in their license.","correct":["A"],"e":"66.A.20 (a) 1.","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"49","q":"An A licence is automatically granted with the issue of which of the following","a":"B1 or B2.","b":"B1.","c":"B2.","correct":["B"],"e":"66.A.20 (a) 2.","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"50","q":"IR Part-66 experience requirements may be reduced with","a":"aircraft production experience.","b":"completion of training at a Part-147 approved school.","c":"completion of a university engineering degree.","correct":["B"],"e":"66.A.30.","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"51","q":"A category C certifying staff authorisation permits the holder to issue a block CRS after","a":"base maintenance.","b":"line maintenance and defect rectification.","c":"any line or base maintenance.","correct":["A","C"],"e":"66.A.20 Para.4.","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"52","q":"When did / will the EASA IR Part-66 licence become sole code","a":"2011.","b":"2003.","c":"2006.","correct":["C"],"e":"AWN 7 App.4 Para.15.","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"53","q":"An EASA IR B1.2 engineer can certify","a":"aircraft - turbine engined.","b":"aircraft -both turbine and piston engined.","c":"aircraft - piston engined.","correct":["C"],"e":"66.A.1 (b).","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"54","q":"An EASA IR B1.3 engineer can certify","a":"helicopters - both turbine and piston engined.","b":"helicopters - piston engined.","c":"helicopters - turbine engined.","correct":["C"],"e":"66.A.1 (b).","img":false},{"s":"10.2. Part-66 - Certifying Staff - Maintenance.","n":"55","q":"How long is an EASA part-66 licence valid","a":"2 years once signed in ink.","b":"5 years once signed and verified that the information contained in the licence is the same as that contained in the competent authority records.","c":"5 years once signed in ink.","correct":["B"],"e":"66.A.40. 10.3. Part-145 - Approved Maintenance Organisations.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"1","q":"Who certifies maintenance of private category aircraft of mass 5700kg or less after 28 September 2006","a":"A type rated engineer independent of a Part145 organisation.","b":"A Part-66 licensed engineer.","c":"A certifying staff member of a Part-145 approved organisation.","correct":["B"],"e":"AWN 7 App.4 Para 13, 14 and 17.5.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"2","q":"A Part-145 organisation based outside the EU, the competent authority is","a":"the CAA.","b":"the NAA of the country it is located in.","c":"the EASA.","correct":["C"],"e":"AWN 7 App. 1 Para 6 Note 1 and 145.1.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"3","q":"How many people sign a CRS after scheduled maintenance","a":"One.","b":"One in each category.","c":"Two.","correct":["A"],"e":"145.A.30 (h) (iii) and 66.A.20 (a) 4.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"4","q":"The independent audit part of a QA department of a large Part-145 company","a":"must be part of the company.","b":"can be combined with the planning department.","c":"can be contracted out to another company.","correct":["A"],"e":"145.A.65 (c) 1, and AMC 145.A.65 (c) (1) 7 and AMC 145.A.65 (c) (2) 7.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"5","q":"Maintenance documentation held by a Part-145 company is kept for","a":"2 years after they were raised.","b":"5 years after they have expired.","c":"2 years after the aircraft has been returned to the operator.","correct":["C"],"e":"145.A.55.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"6","q":"A CRS must be issued","a":"only if an aircraft part is replaced with a new part.","b":"if an aircraft part is removed then re-installed, even if it is the same part.","c":"only when an aircraft part is replaced with a modified part.","correct":["B"],"e":"AWN 3 Para.1.2 (e) and 145.A.50 (a) and Article 2 of EC 2042/2003 (h) 'definitions'.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"7","q":"Who is a Part-145 approved organisation headed by","a":"The Technical Manager.","b":"The QA Manager.","c":"The Accountable Manager.","correct":["C"],"e":"145.A.30 and AMC 145.A.30 (a).","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"8","q":"By what date must large aircraft but not used for commercial air transport, be maintained by a Part-145 company","a":"28 September 2006.","b":"28 September 2008.","c":"currently there is no date specified, such maintenance will always covered under BCARs.","correct":["B","C"],"e":"AWN 7 App.1 Para 2 Note 2.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"9","q":"When the block CRS is finally issued for base maintenance at a Part-145 organisation, who is ultimately responsible for maintenance carried out during the check","a":"the Category B LAE.","b":"the Category C LAE.","c":"the Accountable Manager.","correct":["B"],"e":"145.A.30 para h (iii).","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"10","q":"A Part-145 approval is not required to carry out","a":"daily checks (as long as 48 hours has not passed).","b":"defect rectification.","c":"pre-flight checks.","correct":["C"],"e":"M.A.201 para (d) and 145.A.10 and 2042/2003 article 2 (h).","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"11","q":"How long does a Part-145 approved organisation have to retain aircraft documents","a":"Two (2) years after the aircraft has been released from the organisation.","b":"At least four (4) years after the aircraft has been permanently withdrawn from service.","c":"Five (5) years after the aircraft has been permanently withdrawn from service.","correct":["A"],"e":"145.A.55.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"12","q":"An LAEs license remains valid","a":"if he/she has received continuation training in the last two years.","b":"if he/she has worked on the aircraft type for at least 6 months within the last 2 years.","c":"if he/she has worked on the aircraft type for at least 4 months within the last 2 years.","correct":["B"],"e":"145.A.35 (c).","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"13","q":"An approved Part-145 organisation is one which is","a":"of a standard acceptable to the CAA and the FAA.","b":"of a standard acceptable to the EU.","c":"of a standard as defined in the ANO.","correct":["B"],"e":"NIL.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"14","q":"How long does an licensed engineer have to produce his/her authorisation certification if asked by the CAA or EASA","a":"immediately.","b":"7 days.","c":"24 hours.","correct":["C"],"e":"145.A.35 (l).","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"15","q":"A Part-145 approved maintenance organisation is authorised to","a":"approve major modifications.","b":"issue certificates for work completed in aircraft maintenance or overhaul.","c":"originate repair schemes and manufacture parts.","correct":["B"],"e":"145.A.70 (e).","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"16","q":"Who can sign the CRS","a":"LAE.","b":"LAE who has the permission from the chief inspector.","c":"LAE who is authorised to do so.","correct":["C"],"e":"Part-145 AWN 3.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"17","q":"A situation is found which could hazard an aircraft, while it is undergoing maintenance by a Part-145 organisation. The situation must be reported within","a":"48 hours.","b":"24 hours.","c":"72 hours.","correct":["C"],"e":"145.A.60.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"18","q":"If you are required to produce your License, this must be done","a":"immediately.","b":"within 24 hours.","c":"within a reasonable time.","correct":["B"],"e":"145.A.35 (l).","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"19","q":"How long does an approved organisation have to retain maintenance records","a":"Five years after aircraft leaves service or is scrapped.","b":"Two years after the organisation has released the aircraft.","c":"At least four years after the aircraft has been scrapped.","correct":["B"],"e":"145.A.55 (c).","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"20","q":"How many people sign a CRS after scheduled maintenance","a":"Two, one for mechanical activities and one for the avionics.","b":"One in each category.","c":"One only.","correct":["C"],"e":"145.A.30 (h) (iii).","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"21","q":"A Part-145 organisation finds a condition on an aircraft which could be hazardous, they must inform the CAA within","a":"3 days.","b":"24 hours.","c":"7 days.","correct":["A"],"e":"145.A.60 (e).","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"22","q":"In a Part-145 company, who is responsible for keeping technical information on certifying staff","a":"Tech Records.","b":"Quality Assurance.","c":"Personnel Department.","correct":["B"],"e":"AMC to 145.A.35 (j) 2.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"23","q":"Who monitors how a company is adhering to Part-145","a":"Base Maintenance Manager.","b":"Accountable Manager.","c":"Quality Manager.","correct":["C"],"e":"145.A.65.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"24","q":"For which type of maintenance do you not need a Part-145 approval","a":"Hangar Base Maintenance.","b":"Preflight inspection.","c":"Weekly Check.","correct":["B"],"e":"145.A.30 (j) 3.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"25","q":"CAA approval of a Part-145 organisation to undertake base maintenance of a particular aircraft type will be found in","a":"the companys AOC data sheet.","b":"the company operations manual.","c":"the company limitation part of the approval schedule.","correct":["C"],"e":"Part 145 App III pg 72.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"26","q":"A maintenance company approved under EASA ECAR Part-145 is required for the maintenance of:","a":"all UK civil registered aircraft operating for commercial air transport.","b":"all aircraft with a valid United Kingdom certificate of airworthiness.","c":"only those commercially operated, UK civil registered, aircraft over 5700 KG.","correct":["A"],"e":"AWN 7 App.1 para 2.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"27","q":"A Part-145 company is required to be headed by","a":"a technical director.","b":"a licensed engineer.","c":"an accountable manager.","correct":["C"],"e":"145.A.30 (a).","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"28","q":"Implementation procedures for IR Part-145 may be found in","a":"Airworthiness Notice 14.","b":"BCAR section A.","c":"Air Navigation Regulations.","correct":["A"],"e":"AWN 14.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"29","q":"Unserviceable aircraft equipment should not be stored","a":"in a goods-in store.","b":"on unserviceable shelves around the hangar.","c":"with serviceable spares.","correct":["C"],"e":"145.A.25 (d).","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"30","q":"Under the Part-145 Approval System an A1 Rating relates to aircraft","a":"on base maintenance only.","b":"of 5700 kg MTOM and below.","c":"exceeding 5700 kg MTOM.","correct":["C"],"e":"Part 145 App.II Table 1.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"31","q":"The Approval Reference Number for a typical Part-145 company would be","a":"AI/1234/94.","b":"CAA 00023.","c":"UK.145.00505.","correct":["C"],"e":"See CAP 475 Directory of CAA Approved Organisations.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"32","q":"Line maintenance under Part-145 is defined as typically","a":"C and D checks.","b":"preflight maintenance.","c":"A and B checks.","correct":["C"],"e":"AMC to 145.A.10.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"33","q":"Awards of the EASA Part-145 approval in the UK are made by the","a":"ICAO.","b":"JAA.","c":"CAA.","correct":["C"],"e":"145.1 and see wording on the Approved Certificate on pg 71.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"34","q":"The responsibility for reporting incidents and occurrences during a flight rests with the","a":"aircraft commander.","b":"engineer clearing the tech log.","c":"air stewards.","correct":["A"],"e":"ANO Art.145 5(a) and Directive 2003/42/EC Art 4.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"35","q":"The Authorised Release Certificate EASA Form 1 must be retained for","a":"6 months.","b":"4 years.","c":"3 years after the aircraft has been destroyed or permanently withdrawn from service.","correct":["B"],"e":"Part-145 Appendix 1 Para 4.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"36","q":"Following the replacement and compensation of a direct reading compass certification is made in the form of a","a":"certificate of compensation.","b":"certificate of conformity.","c":"CRS.","correct":["C"],"e":"JAR 145.5 BCAR A/B 6-7 ANO Art.16 (11) (e).","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"37","q":"The minimum distribution of the Authorised Release Certificate EASA Form 1 is","a":"1, to remain with the component to which it refers.","b":"2, one for the originator and one to remain with the component to which it refers.","c":"1, to be retained by the originator.","correct":["B"],"e":"Part-145 Appendix 1 Para 1.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"38","q":"The Authorised Release Certificate EASA Form 1 can","a":"have several items entered onto it providing they are identical part numbers.","b":"have several items entered onto it of different part numbers.","c":"have only one item entered onto it.","correct":["B"],"e":"NIL.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"39","q":"Following satisfactory aircraft component replacement, adjustment, locking and functioning. Which of the following is issued","a":"Certificate of maintenance review.","b":"CRS.","c":"A maintenance statement.","correct":["B"],"e":"145.A.50 (a).","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"40","q":"The authorised release certificate EASA form one is","a":"issued from the tech log prior to the flight.","b":"an international parts release document issued by approved organisations.","c":"used to return or release unserviceable components from the aircraft.","correct":["B"],"e":"Part-145 Appendix 1.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"41","q":"An EASA form 1","a":"may be in English or the language of the country to which the component to which it refers to, is being exported.","b":"must be printed in English regardless of the language of the country to which the component to which it refers to, is being exported.","c":"must be printed in the language of the country to which the component to which it refers to, is being exported.","correct":["B"],"e":"EASA Part 145 Appendix 1.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"42","q":"On completion of the overhaul of an aircraft component by an EASA Part-145 organization","a":"the Worksheets with a certified CRS are retained by the overhaul organization and a JAA Form 1 is issued to the customer.","b":"the Worksheets with a certified CRS are placed in the aircraft file with the log books.","c":"the Worksheets are retained by the overhaul organization in their own files.","correct":["A"],"e":"145.A.50 (d).","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"43","q":"The wording of a CRS issued by a Part-145 organisation can be found in","a":"the ANO.","b":"EASA Part-145 Section A.","c":"The Acceptable Means of Compliance to EASA Part 145.","correct":["C"],"e":"AMC Part 145.A.50 (b) 1.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"44","q":"Who issues a certification authorisation to a Part-66 licence holder","a":"The competent authority.","b":"The quality department of a Part-145 approved organisation.","c":"The base maintenance manager within an approved organisation.","correct":["B"],"e":"145.A.35 (j).","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"45","q":"Independent audits of a department within a Part-145 approved organisation are to be carried out at least every","a":"6 months.","b":"12 month.","c":"24 months.","correct":["B"],"e":"AMC to 145.A.65 (c) (1) Para 5.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"46","q":"The EASA Form 1 is to be used when components are","a":"both exported/imported and bought/sold domestically.","b":"exported or imported only.","c":"used bought and sold domestically only.","correct":["A"],"e":"AMC to 145.A.50 (d).","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"47","q":"After a mandatory inspection has been carried out by a Licensed Engineer, what is issued","a":"Certificate of Release to Service.","b":"A Flight Release Certificate.","c":"A Certificate of Maintenance Review.","correct":["A"],"e":"145.A.50 (a) and definition of 'Maintenance' in (EC) 2042/2003 Article 2.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"48","q":"When an item is removed from an aircraft, then subsequently refitted","a":"no certificate of release to service is required if it is the same item.","b":"only one certificate of release to service is required to cover both the removal and the re-fitment.","c":"two certificates of release to service is required to cover the removal and the re-fitment respectively.","correct":["C"],"e":"AMC to 145.A.50 (a) Para 1.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"49","q":"For the purposes of EASA Part-145, a 'Large aircraft' is","a":"over 13610 kg MTOM.","b":"over 2730 kg MTOM.","c":"over 5700 kg MTOM.","correct":["C"],"e":"AWN 7 App.1 Para.2 Note 1.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"50","q":"An organisation holding an EASA Part-145 approval for light aircraft","a":"must apply for and qualify for an equivalent BCAR (M3) approval seperately.","b":"automatically hold an equivalent BCAR (M3) approval also.","c":"are not permitted to hold the equivalent BCAR (M3) approval.","correct":["A"],"e":"BCAR A8-15 states that Organisations already holding JAR 145 approval must apply for approval under A8-15 M3 using the normal procedure.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"51","q":"If a temporary wiring repair has to be carried out on an aircraft which is away from its Maintenance Organization, how would this be certified","a":"No Certification need be made.","b":"Aircraft would be certified as Fit for Flight under 'A' conditions.","c":"By signing a Certificate of Release to Service.","correct":["C"],"e":"145.A.30 (j) 5 One-off certification authorisation.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"52","q":"A company has approval reference of form EASA.145.00X? It is located","a":"outside a European Member State.","b":"in the USA.","c":"within a European Member State.","correct":["A"],"e":"145.1.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"53","q":"On completion of the overhaul of an aircraft component by an overhaul organization","a":"the worksheets with a certified CRS are retained by the overhaul organization and an EASA form 1 is issued to the customer.","b":"the worksheets with a certified CRS are placed in the aircraft file with the log books.","c":"the worksheets are retained by the overhaul organization in their own files.","correct":["A"],"e":"145.A.50 (d).","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"54","q":"A Part-145 approved organisation may subcontract specialist work to","a":"any non-approved company.","b":"any BCAR approved company.","c":"any BCAR approved company that is listed in their Maintenance Organisation Exposition.","correct":["C"],"e":"AWN 14 Appendix 3 Para.3.1 (b).","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"55","q":"Signatories to the CRS will be found in","a":"Airworthiness Notice No.3.","b":"the organization exposition.","c":"BCAR Section A-8/13, A-8/15, A-8/3.","correct":["B"],"e":"145.A.70 Para.3.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"56","q":"EASA IR Part-145","a":"lists the minimum requirements acceptable to the CAA.","b":"applies to all European Aircraft.","c":"replaces the relevant chapters of BCAR Section A.","correct":["C"],"e":"Part-145 replaces parts of BCAR A8.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"57","q":"Aircraft and aircraft component records must be retained by a Part-145 approved organization for a period of","a":"three years after the aircraft component is permanently removed from service or destroyed.","b":"two years after the aircraft or aircraft component has been released from the Part-145 approved maintenance organization.","c":"5 years after the aircraft or aircraft component has been destroyed or permanently removed from service.","correct":["B"],"e":"145.A.55 (c).","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"58","q":"The staffing requirements for an organization approved to undertake maintenance on commercial transport aircraft are to be found in","a":"EASA IR Part-145.30.","b":"JAR E.25D.","c":"EASA IR Part-25.13.","correct":["A"],"e":"145.A.30.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"59","q":"EASA IR Part-145 approved organizations are approved to maintain","a":"all UK registered aircraft used for commercial transport purposes.","b":"all UK registered aircraft used for commercial transport purposes and aircraft exceeding 5700 kg MTWA in any C of A category.","c":"all UK registered aircraft above 5700 kg MTWA.","correct":["B"],"e":"Regulation (EC) No 2042/2003 Article 4, and AWN 7 App. 1 Para 2.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"60","q":"The extent of an organisation's Part-145 approval is stated","a":"on the approval certificate.","b":"in the CAA's list of approved organisations.","c":"in the organisation's exposition.","correct":["A"],"e":"Part-145 Appendix II.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"61","q":"On a Certificate of Release for Service an adjustment to a control would come under the heading","a":"replacement.","b":"repair.","c":"overhaul.","correct":["B"],"e":"AWN3 / Part-145 definitions.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"62","q":"To comply with IR Part-145","a":"the Acceptable Means of Compliance can be used.","b":"any additional national directives must be used.","c":"JAA Joint Circulars should be used.","correct":["A"],"e":"NIL.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"63","q":"The list of typical tasks which cat-A line maintenance mechanic may perform is contained in","a":"Part 145.","b":"Part 147.","c":"Part 66.","correct":["A"],"e":"AMC to 145.A.30 (g).","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"64","q":"An aircraft component which comes with an EASA form 1","a":"will not need a CRS when fitted as a form 1 is also a CRS.","b":"will also require a form 8130-3 if fitted to a British aircraft.","c":"will require a CRS to be issued when fitted to certify correct installation as the form 1 CRS applies only to the conformity of the component.","correct":["C"],"e":"AMC to 145.A.50.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"65","q":"An organisation seeking approval to carry out maintenance on an aeroplane of 6000kg MTWA carrying cargo only, would apply for approval under","a":"CS 25.","b":"IR Part-145.","c":"BCAR section A or B depending on country of origin of aeroplane.","correct":["B"],"e":"AWN 7 App.1 Para.2.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"66","q":"Category C licensed engineers are backed up by","a":"engineers holding existing BCAR section-L licence in the appropriate category.","b":"hanger based cat B1 and B2 licensed maintenance technicians and mechanics with appropriate type ratings.","c":"cat B1 and B2 technicians with type rating.","correct":["C"],"e":"145.A.30 (g).","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"67","q":"Since EASA IR Part-145 came into effect","a":"it lists the minimum requirements acceptable to the CAA.","b":"it has replaced the relevant chapters of BCAR.","c":"it currently applies only to transport passenger aircraft.","correct":["B"],"e":"EASA IR Part-145 is the requirements acceptable to the whole EASA (which rules out b.). It has replaced some of BCAR A8.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"68","q":"Part-66 certifying staff must be","a":"not less than 21 years of age.","b":"There is no Age limitation.","c":"not less than 18 years of age.","correct":["A"],"e":"145.A.35 (m).","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"69","q":"A Part-145 organisation's accountable manager is responsible for","a":"ensuring that all line maintenance procedures are carried out.","b":"ensuring that all necessary resources are available to accomplish maintenance in accordance with Part 145.A.65 (a).","c":"ensuring that all base maintenance procedures are carried out.","correct":["B"],"e":"145.A.30 (b).","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"70","q":"The list of EASA Part-145 approved maintenance organisations is found in","a":"the CAA list of approved organisations.","b":"the maintenance schedule.","c":"the company's exposition.","correct":["A"],"e":"CAP475 Directory of CAA Approved Organisations.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"71","q":"After a modification on an aircraft system, a certificate of release to service is issued. To do this yourequire","a":"Part-21 Subpart H approval.","b":"ICAO approval.","c":"Part-145 approval.","correct":["C"],"e":"Part 145.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"72","q":"What aircraft can an EASA part-145 company maintain","a":"Commercial Air Transport aircraft only.","b":"All aircraft over 5700 kg MTOM.","c":"All aircraft on its schedule of approval.","correct":["C"],"e":"See Part-145 Appendix II.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"73","q":"How long have you got, to produce a Part-66 licence when asked to do so","a":"Within 7 days.","b":"Within 5 days.","c":"Within 24 hours.","correct":["C"],"e":"145.A.35 (l).","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"74","q":"An aircraft has an unapproved repair","a":"Issue a CRS to approve it.","b":"Issue a Fitness for Flight cert.","c":"It cannot be certified until the repair is approved.","correct":["C"],"e":"See the wording on a CRS in AMC to Part-145.","img":false},{"s":"10.3. Part-145 - Approved Maintenance Organisations.","n":"75","q":"The requirement for having a Quality Department to a maintenance organisation are set out in","a":"IR Part 21.","b":"IR Part M.","c":"IR Part-145.","correct":["C"],"e":"NIL. 10.4. JAR-OPS - Commercial Air Transport.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"1","q":"The responsibility for regularly weighing aircraft rests with the","a":"operator.","b":"Part-145 maintenance organisation.","c":"CAA.","correct":["A"],"e":"JAR-OPS Subpart J.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"2","q":"Documents to be carried include","a":"Certificate of Registration, Airworthiness, Insurance and Radio License.","b":"C of A, Permit to Fly, radio License, Crew Licenses, and C of R.","c":"Crew licenses, radio licence and aircraft dealers certificate.","correct":["A"],"e":"JAR OPS Subpart B 1.125.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"3","q":"The requirement for re-weighing an aircraft under JAR-OPS is","a":"at manufacturer, then two years and five yearly thereafter.","b":"at manufacturer and then four yearly intervals.","c":"at manufacturer and then five yearly intervals.","correct":["B"],"e":"JAR OPS Subpart J.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"4","q":"Aircraft types which an operator can fly are listed in the","a":"Aircraft Flight Manual.","b":"Air Operators Certificate.","c":"Company Maintenance Schedule.","correct":["B"],"e":"Appendix 1 to JAR-OPS 1.175.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"5","q":"Where can information on the aircraft documents to be carried be found","a":"ECAR Part-145.","b":"JAR-OPS subpart B.","c":"ANO schedule 3.","correct":["B"],"e":"JAR OPS Subpart B.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"6","q":"An aircraft registered in the UK and operating in the transport category will normally be operated","a":"by the holder of an AOC.","b":"Under B conditions.","c":"by the owners.","correct":["A"],"e":"JAR OPS.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"7","q":"In which book would you expect to find all the following: a CMR, a maintenance statement, a sector record and a deferred defect","a":"Technical log book.","b":"Flight manual.","c":"Aircraft Log book.","correct":["A"],"e":"JAR-OPS Subpart M Para.1.915.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"8","q":"Amendments to JAR OPS are by way of","a":"orange pages.","b":"grey pages.","c":"blue pages.","correct":["A"],"e":"All JARs are amended on orange papers.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"9","q":"Deferred defects are recorded in","a":"the Deferred defect manual.","b":"the Technical Log.","c":"the Technical Manual.","correct":["B"],"e":"JAR-OPS 1.915 ANO Art.15.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"10","q":"Which of the following documents must be carried on an aircraft","a":"Certificate of Registration.","b":"Air operators Certificate.","c":"Engine Log Book.","correct":["A"],"e":"ANO Sched.10 and JAR-OPS Subpart B.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"11","q":"Large Aircraft Maintenance Schedules are produced by","a":"manufacturer with CAA approval.","b":"operator.","c":"CAA Safety Regulation Group.","correct":["B"],"e":"JAR-OPS Subpart M 1.910, M.A.708 (b) 2.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"12","q":"Aircraft over 5700kg MTOM are weighed","a":"at the renewal of the Certificate of Airworthiness.","b":"prior to entry into service and then every 4 years.","c":"annually.","correct":["B"],"e":"JAR OPS 1.605.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"13","q":"JAR OPS subpart J covers","a":"maintenance.","b":"instruments and equipment.","c":"mass and balance.","correct":["C"],"e":"See JAR OPS.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"14","q":"JAR OPS 3 applies to","a":"commercial transport.","b":"aeroplanes.","c":"helicopters.","correct":["C"],"e":"JAR OPS 1 is Aeroplanes, JAR OPS 3 is helicopters.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"15","q":"Which of the following form part of the aircraft Technical Log","a":"Future maintenance program for the pilots information.","b":"Pilots name and number.","c":"CRS and weight and balance information.","correct":["A"],"e":"JAR OPS subpart M Para.1.915 (a) (3).","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"16","q":"Which of the following documents are to be carried on an aircraft","a":"Tech log, full Operations Manual and Flight Manual.","b":"Tech Log and parts of the Operations Manual.","c":"Full Operations Manual and Flight Manual.","correct":["B"],"e":"JAR OPS Subpart B Para.1.130 and 1.135.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"17","q":"Who approves the aircraft Technical Log","a":"The Part-145 organisation maintaining the aircraft.","b":"The operator.","c":"The National aviation authority.","correct":["C"],"e":"JAR OPS Subpart M Para.1.915 (b).","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"18","q":"The documents to be carried on an aircraft are stated in the","a":"flight manual.","b":"JAR OPS.","c":"appropriate ANO article.","correct":["B"],"e":"Listing of Docs. to be carried are in Schedule 10 of ANO (for non-CAT aircraft), not the article. JAR OPS Subpart B Para.1.125 lists them for CAT aircraft.\".","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"19","q":"What is the minimum legal decision height for Cat I auto landing","a":"100 to 200 ft.","b":"200 to 300 ft.","c":"400 to 500 ft.","correct":["B"],"e":"JAR Ops Subpart E Table 5. 10.5a. Aircraft Certification - General.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"1","q":"A type certificate is","a":"issued after a Certificate of Registration.","b":"issued before a Certificate of Airworthiness.","c":"issued after a Certificate of Airworthiness.","correct":["B"],"e":"BCAR A/B2-2 Para.2.1.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"2","q":"A Type Certificate is a","a":"requirement prior to the issue of a C of A for aircraft in the Transport Category.","b":"requirement for aircraft above 2730Kg MTWA.","c":"prerequisite to the issue of a C of A.","correct":["C"],"e":"BCAR A/BA2-2.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"3","q":"A design organisation is approved in accordance with","a":"IR Part-21.","b":"IR Part-145.","c":"BCARs.","correct":["A"],"e":"IR part-21.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"4","q":"The standard to which the B747-400 was certified to was","a":"BCAR section D.","b":"JAR-25.","c":"JAR-21.","correct":["B"],"e":"Do a Google search for the Boeing 747-400 type certificate.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"5","q":"A Type Certificate is issued to","a":"an aircraft type and its variants.","b":"all aircraft of a type (e.g. A340).","c":"each aircraft of a type.","correct":["B"],"e":"BCAR A/B2-2.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"6","q":"A Certificate of design is raised","a":"by the CAA.","b":"by the manufacturer.","c":"by the operator.","correct":["B"],"e":"The certificate of design certifies that the aircraft design conforms to BCARs or EASAs as appropriate and is signed by the chief designer.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"7","q":"Certificates of design certify","a":"that a major mod has been designed adequately.","b":"that a company has design approval.","c":"that the aircraft meets current stated design requirements BCARs/EASA as specified.","correct":["C"],"e":"The certificate of design certifies that the aircraft design conforms to BCARs or EASAs as appropriate and is signed by the chief designer.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"8","q":"An aircraft manufacturer approved to EASA Part-21, may maintain aircraft and issue certificates of release to service","a":"for any aircraft providing it is on its schedule of approval.","b":"only if it holds a Part-M or Part-145 approval also.","c":"only for the aircraft that it has produced.","correct":["C"],"e":"21.A.163 (d).","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"9","q":"A prototype engine is defined as","a":"a foreign built engine which has been issued with type certificates by both the airworthiness authority of the country of origin and the British CAA.","b":"a type of engine which has not been evaluated by the CAA before for the purpose of the issue of a British type certificate.","c":"a new engine but similar to one previously investigated by the CAA for the issue of a British type certificate.","correct":["B"],"e":"BCAR A/B4-2.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"10","q":"A type certificate issued to an aircraft by the CAA","a":"shows approval of the design by the CAA only.","b":"shows approval of the design by the CAA and would be approved under EASA.","c":"shows approval of the design by the CAA but will not necessarily be approved under EASA.","correct":["C"],"e":"Aircraft could be certified (in UK) to BCAR Section D, which would not confer automatic type certification by EASA. However, all new aircraft will be certified to Part-21 CS 25, which would confer automatic type certification across EASA states.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"11","q":"An EASA Part-145 organisation may classify repairs as major or minor if approved in accordance with","a":"EASA Part-145.","b":"EASA Part-21 subpart J.","c":"JAR OPS subpart M.","correct":["B"],"e":"21.A.263 (c).","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"12","q":"A type certificate is issued to","a":"aircraft identical in all major areas to a previous approved aircraft.","b":"aircraft similar to a previous aircraft but with design differences.","c":"a prototype aircraft.","correct":["C"],"e":"Section A/B 2-2 and 2-3. 10.5b. Aircraft Certification - Documents.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"1","q":"What BCAR covers Noise Certification requirements","a":"Section D now replaced by EASA CS-25.","b":"Section A and B.","c":"Section N.","correct":["C"],"e":"Air Navigation (Noise Certification) Order 1990.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"2","q":"Which of the following does not require a Noise Certificate","a":"A helicopter under 5700 kg.","b":"A small business jet aircraft.","c":"A fixed wing aircraft under 2730 kg.","correct":["B"],"e":"Air Navigation (Noise Certification) Order 1990.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"3","q":"To what stage of flight is a Noise Certificate applicable","a":"Take-off and landing.","b":"All stages of flight.","c":"Take-off only.","correct":["A"],"e":"Air Navigation (Noise Certification) Order 1990.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"4","q":"When does an aircraft not require a Noise Certificate","a":"When flying with a Permit to Fly.","b":"When flying under A and B conditions.","c":"When flying in UK airspace only, and not crossing any international borders.","correct":["B"],"e":"Air Navigation (Noise Certification) Order 1990.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"5","q":"What could invalidate a Noise Certificate","a":"A modification.","b":"An unauthorised or unapproved repair is carried out.","c":"Once issued, nothing can invalidate it.","correct":["A"],"e":"Air Navigation (Noise Certification) Order 1990.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"6","q":"When is a Noise Certificate required to be carried aboard the aircraft","a":"At all times.","b":"When flying in UK airspace only.","c":"When flying in UK or any EU member state airspace.","correct":["C"],"e":"Air Navigation (Noise Certification) Order 1990.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"7","q":"On completion of a major modification to an EASA aircraft, for the purposes of a flight test","a":"issue a Certificate of Fitness to Fly since the C of A has been invalidated.","b":"the C of A is valid providing it is still within the date shown on it.","c":"issue a Permit to Fly.","correct":["B"],"e":"AWN-9 issue4, para. 2.3.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"8","q":"The Flight Manual is part of the","a":"JAA Form 1.","b":"Certificate of Airworthiness.","c":"Certificate of Registration.","correct":["B"],"e":"BCAR A/B7-2 Para.1.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"9","q":"What Certificate must an Operator have who flies for public transport and cargo carrying","a":"Air Navigation Certificate.","b":"Air Transport Licence.","c":"Air Operators Certificate.","correct":["C"],"e":"ANO Art.6.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"10","q":"The validity of a C of A extends for","a":"six months.","b":"as stated on the certificate.","c":"the life of the aircraft or a change of ownership.","correct":["B"],"e":"ANO Art 8,9 & 10.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"11","q":"A certificate of airworthiness is a requirement of","a":"IR Part-21.","b":"JAR OPS.","c":"IR Part-M.","correct":["A"],"e":"EASA Part-21 Subpart H.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"12","q":"What is the period of validity for a Certificate of Registration","a":"Until a change of ownership or maintenance arrangements.","b":"Until a change of ownership.","c":"The same as for the aircrafts C of A.","correct":["B"],"e":"NIL.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"13","q":"A series EASA aircraft flying for the approval of a major modification flies under","a":"A conditions.","b":"a permit to fly.","c":"B conditions.","correct":["B"],"e":"AWN 9.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"14","q":"When preparing a weight and C of G schedule, the variable load can be calculated from the","a":"weight of the pilots and any special equipment that they carry.","b":"weight of A.P.S. and payload.","c":"Nothing.","correct":["A"],"e":"BCAR A/B6-4 Para 2.3.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"15","q":"A non-expiring EASA C of A will be issued by the CAA after","a":"28 September 2005.","b":"28 September 2008.","c":"28 September 2007.","correct":["C"],"e":"AWN 7 Appendix 3 Para 4.4.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"16","q":"When a flight test is necessary and the C of A has expired","a":"the flight can only be authorised by a CAA surveyor.","b":"a certificate for fitness of flight shall be issued.","c":"the pilot can authorise the flight in the tech log book.","correct":["B"],"e":"BCAR A/B3-8 ANO Sched.3 Part A 2 (a) (i).","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"17","q":"A Certificate of Approval of Aircraft Radio Installation is awarded","a":"before the aircraft obtains a C of A.","b":"after the aircraft obtains a C of A.","c":"regardless of the aircraft's C of A status.","correct":["C"],"e":"BCAR A/B3-11 Para 2.1.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"18","q":"A certificate of fitness for flight","a":"clears an aircraft for a scheduled flight.","b":"permits the aircraft to fly under A condition.","c":"permits the aircraft to fly under B conditions.","correct":["B"],"e":"BCAR A/B3-8.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"19","q":"A Certificate of Clearance can be issued by organisations with BCAR approval","a":"A8-13.","b":"A8-9.","c":"Primary Companies.","correct":["B"],"e":"BCAR A/B3-9.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"20","q":"A flight manual","a":"must be carried on all public transport aircraft.","b":"forms part of the C of A.","c":"is sometimes called the operations manual.","correct":["B"],"e":"BCAR A/B7-2.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"21","q":"A radio station license becomes invalid","a":"whenever a radio Flight test is required.","b":"upon change of ownership of aircraft.","c":"when the c of a is due for renewal.","correct":["B"],"e":"BCAR A/B3-11 para 5.1.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"22","q":"A certificate of approval of Aircraft Radio Installation is issued to","a":"an aircraft.","b":"an air operator.","c":"a company approved for such installations.","correct":["A"],"e":"ANO Art.15, Sched. 5 and BCAR A/B3-11.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"23","q":"A C of A for export is","a":"to allow an aircraft to be flown away on export.","b":"A statutory document.","c":"necessary for each exported aircraft.","correct":["C"],"e":"BCAR A/B3-6 Para 1.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"24","q":"The purpose for which an aircraft may be flown on a special category C of A is","a":"applicable to ex military aircraft only.","b":"stated on the certificate.","c":"for private use only.","correct":["B"],"e":"BCAR A/B1-2 Para 2.2 (e).","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"25","q":"The period of validity of a Permit Flight Release Certificate is","a":"stated on the permit to fly.","b":"until the end of the days flying.","c":"stated in the maintenance schedule.","correct":["A"],"e":"Appendix 3 to BCAR A3-7.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"26","q":"A permit to fly is valid","a":"for 12 months.","b":"until the date stated on it.","c":"only for evaluating a modification.","correct":["A"],"e":"BCAR A3-7 para 9.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"27","q":"C of As for EASA aircraft are","a":"necessary for all aircraft.","b":"required by IR Part 145.","c":"required by ANO.","correct":["C"],"e":"IR Part 21 Article 1 and Subpart H.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"28","q":"The period of validity of an EASA C of A is","a":"as stated on certificate.","b":"36 months.","c":"indefinite.","correct":["C"],"e":"21A.181 (a).","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"29","q":"An aircraft with a Standard category C of A may be used for","a":"any purpose.","b":"carrying passenger and/or freight only.","c":"carrying passengers only.","correct":["A"],"e":"ANO Schedule 3 Part B.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"30","q":"A Cof R is renewable","a":"when aircraft is sold abroad.","b":"every year.","c":"when ownership changes in U.K. only.","correct":["A"],"e":"ANO Art 3 and 4.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"31","q":"A C.of R","a":"is issued by Ministry of Trade and Industry.","b":"may not be issued if aircraft could be more suitable registered elsewhere.","c":"is valid only in country of origin.","correct":["B"],"e":"ANO Art.3.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"32","q":"When an aircraft is sold, the Certificate of Airworthiness","a":"must be reapplied for only if it is sold to an owner within another member state.","b":"must always be reapplied for.","c":"does not need to be reapplied for regardless of where it is sold.","correct":["A"],"e":"21A.179 (a).","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"33","q":"A Noise certificate is valid for","a":"unlimited duration.","b":"until a change in ownership of the aircraft to an owner located in another member state.","c":"until a change in ownership of the aircraft.","correct":["B"],"e":"21A.211.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"34","q":"Categories with respect to the C of A are","a":"Transport, Aerial Work, Passenger and Special.","b":"Standard and Special.","c":"Transport (Passenger) and Passenger (Cargo).","correct":["B"],"e":"ANO Sched. 3 Part B.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"35","q":"When is a Certificate of Fitness for Flight under A conditions required","a":"To allow an unregistered aircraft to fly for air test.","b":"After a Certificate of Maintenance Review has been signed.","c":"To allow an aircraft to fly on air test to check out a modification.","correct":["C"],"e":"ANO Art.8 Para 2. (d) Sched.2.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"36","q":"An aircraft Radio License has to be renewed","a":"every three years.","b":"every five years.","c":"only on change of aircraft ownership.","correct":["C"],"e":"BCAR A/B3-11 Para.5.1.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"37","q":"An aircraft is awaiting spares. What effect has this on the Certificate of Maintenance Review","a":"Deduct time.","b":"Remains unchanged.","c":"Add time.","correct":["B"],"e":"BCAR A/B6-2 Para.5.2 (c).","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"38","q":"An aircraft with a transport category C of A cannot be flown for hire and reward except","a":"under the terms of an air operators certificate.","b":"under the terms of an aerial work certificate.","c":"under the terms of an aircraft dealers certificate.","correct":["A"],"e":"ANO Art.6.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"39","q":"If an EASA aircraft is required to be flown without a C of A, for the issue of a C of A","a":"an EASA Permit to Fly is applied for.","b":"it can be flown with special permission from the competent authority.","c":"it can be flown under A Conditions.","correct":["A"],"e":"AWN 9, Para2.2.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"40","q":"A British aircraft manufacturer must apply for a Certificate of Airworthiness","a":"to the Department of Trade and Industry.","b":"to the I.C.A.O.","c":"to the C.A.A.","correct":["C"],"e":"ANO Art.9.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"41","q":"A Noise Certificate is a requirement of","a":"IR Part-21.","b":"JAR OPS.","c":"IR Part-M.","correct":["A"],"e":"EASA Part-21 Subpart I.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"42","q":"Variable load is weight of","a":"fuel, oil and non-expendable equipment relevant to role.","b":"crew, their baggage and equipment relevant to role.","c":"basic weight plus operating weight.","correct":["B"],"e":"BCAR A/B6-4 Para.2.3.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"43","q":"A Flight Manual is","a":"part of the Certificate of Registration.","b":"part of the Certificate of Airworthiness.","c":"for information of the crew only.","correct":["B"],"e":"BCAR A/B7-2 Para.1.1.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"44","q":"What is the period of validity of a C of A for an aircraft in the Special Category below 2730 kg","a":"On-going, provide the aircraft is maintained to an Approved Maintenance Schedule.","b":"1 Year.","c":"3 Years.","correct":["B"],"e":"A Special Category certificate is not normally issued for more than 12 months.","img":false},{"s":"10.4. JAR-OPS - Commercial Air Transport.","n":"45","q":"A new imported series aircraft  maintenance can be extended by authority written into the","a":"Approved Maintenance Schedule.","b":"Aircraft Maintenance Manual.","c":"Approved Maintenance Document.","correct":["A"],"e":"Usually 10%.","img":false},{"s":"10.6. Part-M.","n":"11","q":"Vital points are","a":"parts of the aircraft where a single malfunction could cause catastrophic failure.","b":"a check on every maintenance schedule input.","c":"when an engine/fuel system is disturbed.","correct":["A"],"e":"NIL.","img":false},{"s":"10.6. Part-M.","n":"12","q":"How many items can be entered on an Approved Certificate","a":"Only 1.","b":"As many as there is room for providing they are similar items.","c":"As many as there is room for providing each entry is perfectly readable.","correct":["C"],"e":"NIL.","img":false},{"s":"10.6. Part-M.","n":"13","q":"An Approved Certificate must have","a":"an approved signature.","b":"three (3) duplicate copies.","c":"the date of manufacture of the component to which it refers.","correct":["A"],"e":"An Approved Certificate must have an Approved signature.","img":false},{"s":"10.6. Part-M.","n":"14","q":"An incident must be reported within","a":"96 hours.","b":"earliest convenient time.","c":"24 hours.","correct":["A"],"e":"CAP 382 Para.6.1.4. MOR scheme.","img":false},{"s":"10.6. Part-M.","n":"15","q":"What approval would you need to maintain airships","a":"BCAR A8 18.","b":"Part-145 with two sections of BCAR A8 18.","c":"JAR A.","correct":["A","B"],"e":"AWN 14 Para 4.2 and AWN 46 Para 2.6 and 66.A.100.","img":false},{"s":"10.6. Part-M.","n":"16","q":"Details of all placards and markings on an aircraft will be found in","a":"the Maintenance Manual.","b":"the Operations Manual.","c":"the Flight Manual.","correct":["A"],"e":"ATA 100 Chapter 11.","img":false},{"s":"10.6. Part-M.","n":"17","q":"If a repair is made on an aircraft down route, but cannot be certified","a":"the pilot (with certain conditions) can authorise it to fly to a place where it can be certified.","b": :"The ANO applies to all aircraft on the UK civil register.","img":false},{"s":"10.6. Part-M.","n":"23","q":"Schedules of the Air Navigation Order","a":"are explained in more detail by the Articles.","b":"explain in more detail parts of the articles.","c":"explain in more detail parts of the General Regulations.","correct":["B"],"e":"Each Schedule amplifies and clarifies one or more of the Articles. SEE CAP 393.","img":false},{"s":"10.6. Part-M.","n":"24","q":"All aircraft which fly in UK airspace must be registered, with the exception of","a":"none.","b":"kites, captive balloons and aircraft under B conditions.","c":"kites, balloons, gliders and variant aircraft.","correct":["B"],"e":"ANO Art.3.","img":false},{"s":"10.6. Part-M.","n":"25","q":"An aircraft need not be registered if it is a non-EASA aircraft and being operated by","a":"an operator using the aircraft solely for aerial work.","b":"an aircraft dealer, not taking the aircraft overseas.","c":"an aircraft dealer, demonstrating the aircraft overseas.","correct":["B"],"e":"ANO Art.3 - under B conditions.","img":false},{"s":"10.6. Part-M.","n":"26","q":"A Certificate of Maintenance Review is retained","a":"for six (6) months from date of issue.","b":"for two (2) years from date of issue.","c":"until two (2) years after the aircraft has been destroyed or permanently withdrawn from service.","correct":["B"],"e":"ANO Art 14 para 8.","img":false},{"s":"10.6. Part-M.","n":"27","q":"Authority to amend a maintenance schedule is given by the","a":"local CAA surveyor.","b":"CAA with written consent.","c":"operator.","correct":["B"],"e":"BCAR A/B7-5 3.1.1.","img":false},{"s":"10.6. Part-M.","n":"28","q":"A Licensed Engineer will sign a CRS when","a":"he is happy that all physical aspects of the job are finished.","b":"he is sure that he has company approval.","c":"the job is complete and properly recorded.","correct":["C"],"e":"AWN 3.","img":false},{"s":"10.6. Part-M.","n":"29","q":"A Certificate of Maintenance Review
