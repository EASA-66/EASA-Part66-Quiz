Part-M.","n":"35","q":"Details of placards and markings on aircraft will be found in","a":"ATA Chapter 11 of the AMM.","b":"Operations Manual.","c":"Approved Maintenance Manual.","correct":["A"],"e":"ATA 100 Chapter 11.","img":false},{"s":"10.6. Part-M.","n":"36","q":"The legal responsibility for ensuring that the aircraft load is not excessive and has been properly loaded rests with","a":"Commander of the aircraft.","b":"Load Master.","c":"Chief Pilot.","correct":["A"],"e":"ANO Art.43 para 5.","img":false},{"s":"10.6. Part-M.","n":"37","q":"When does a Radio Licence become valid","a":"When the C of A is issued.","b":"After the radio station has been approved and the Certificate of Approval issued.","c":"Once the Certificate of Registration has been issued.","correct":["B"],"e":"BCAR A/B3-11.","img":false},{"s":"10.6. Part-M.","n":"38","q":"The telecommunications log book is considered to be part of the","a":"Public Address Licence.","b":"Radio Licence.","c":"Radio approved document.","correct":["B"],"e":"NIL.","img":false},{"s":"10.6. Part-M.","n":"39","q":"For what period of time must a load sheet be kept","a":"Five years.","b":"Two years.","c":"Six months.","correct":["C"],"e":"ANO Art.43 Para.8.","img":false},{"s":"10.6. Part-M.","n":"40","q":"Information about identification markings can be found in","a":"EASAs.","b":"ANO.","c":"CAAIPs.","correct":["C"],"e":"CAAIPs Part 3. ANO also has information on where the markings are.","img":false},{"s":"10.6. Part-M.","n":"41","q":"Certificates of Fitness for Flight are signed by","a":"A CAA surveyor.","b":"An appropriately licensed engineer.","c":"An Inspector or QA Engineer.","correct":["B"],"e":"BCAR A/B3-8 2.1.","img":false},{"s":"10.6. Part-M.","n":"42","q":"Under what conditions can you fly when a C of A has expired","a":"C conditions.","b":"B conditions.","c":"A conditions.","correct":["C"],"e":"BCAR A/B3-8 1.2.","img":false},{"s":"10.6. Part-M.","n":"43","q":"Flying times are recorded from","a":"take off to touch down.","b":"chock to chock.","c":"engine start to shut down.","correct":["A"],"e":"ANO Sched. 6 para 1 (4).","img":false},{"s":"10.6. Part-M.","n":"44","q":"Equipment required to be carried on aircraft flying for the purpose of Public Transport is specified in the","a":"Air Navigation Order, Schedule 4.","b":"Air Navigation (General) Regulations, Schedule 9.","c":"Air Navigation Order (Rules of the Air), Schedule 2.","correct":["A"],"e":"ANO Sched.4 Scales of equipment.","img":false},{"s":"10.6. Part-M.","n":"45","q":"Flying under A conditions is carried out by aircraft in the","a":"proto-modified Group.","b":"variant Group.","c":"series aircraft group.","correct":["C"],"e":"A conditions is generally for the series aircraft.","img":false},{"s":"10.6. Part-M.","n":"46","q":"The period of validity for a Certificate of Fitness for Flight is","a":"not exceeding the validity of the C of A.","b":"a maximum of ten days.","c":"a maximum of seven days.","correct":["C"],"e":"BCAR A/B3-8 Para.2.2.","img":false},{"s":"10.6. Part-M.","n":"47","q":"When is a flight test certificate signed","a":"After a test flight.","b":"Before a test flight.","c":"Whenever an aircraft is flown.","correct":["A"],"e":"BCAR A/B3-5 Para.3.2.","img":false},{"s":"10.6. Part-M.","n":"48","q":"When is a 'Permit Flight Release Certificate' issued","a":"Before an aircraft is flown with a valid C of A.","b":"Before an aircraft is test flown with a permit to fly.","c":"Before a series aircraft is flown.","correct":["B"],"e":"BCAR A/B3-7 Para.7.","img":false},{"s":"10.6. Part-M.","n":"49","q":"The minimum equipment list is found in the","a":"Flight manual.","b":"Maintenance manual.","c":"Maintenance schedule.","correct":["A"],"e":"MEL is found in the Flight Manual or the Operations Manual.","img":false},{"s":"10.6. Part-M.","n":"51","q":"When would a repair scheme be treated as a modification","a":"When the repair has not previously been approved by the CAA and FAA.","b":"When the repair has not previously been approved by the FAA.","c":"When the repair has not previously been approved by the CAA.","correct":["C"],"e":"NIL.","img":false},{"s":"10.6. Part-M.","n":"52","q":"A letter of transmittal is","a":"authorisation to use an Approved Maintenance Schedule.","b":"authorisation to amend a Maintenance Manual.","c":"a record of accepting a type certificate.","correct":["B"],"e":"A letter of transmittal is authorisation to amend a Maintenance Manual.","img":false},{"s":"10.6. Part-M.","n":"53","q":"A LAMS schedule applies to aircraft","a":"under 2730Kg MTWA.","b":"over 3600Kg MTWA.","c":"under 2300Kg MTWA.","correct":["A"],"e":"AWN 6 Para 18.1 CAP 411 & 412.","img":false},{"s":"10.6. Part-M.","n":"54","q":"Where are scales of equipment to be carried found","a":"Air Navigation Order, schedule 4.","b":"Airworthiness Notices.","c":"Air Navigation (General) Regulations.","correct":["A"],"e":"ANO Sched.4.","img":false},{"s":"10.6. Part-M.","n":"55","q":"If a modification is carried out on an aircraft, it is entered","a":"the modification record book.","b":"both aircraft and modification log books.","c":"the aircraft log book.","correct":["B"],"e":"BCAR A/B7-9.","img":false},{"s":"10.6. Part-M.","n":"56","q":"On completion of a modification to a non-EASA aircraft, for the purpose of a test flight","a":"a Permit to Fly is issued.","b":"the C of A is valid so long as it is still in date.","c":"a Certificate of Fitness for Flight is issued as the C of A has been invalidated.","correct":["C"],"e":"BCAR A/B3-8 and ANO Art.8 2 (d).","img":false},{"s":"10.6. Part-M.","n":"57","q":"Deferred defect pages are kept in the","a":"maintenance schedule.","b":"log book.","c":"tech log.","correct":["C"],"e":"BCAR A/B7-8 2.1 (e).","img":false},{"s":"10.6. Part-M.","n":"58","q":"Companies with design approval can be found in","a":"front of the maintenance schedule.","b":"Part-145 list of companies.","c":"the company exposition.","correct":["B"],"e":"CAP 475 AWN 6 Para.11.","img":false},{"s":"10.6. Part-M.","n":"59","q":"Certificate of Airworthiness for International flight on transport aircraft","a":"must be carried.","b":"must not be flown with aircraft.","c":"does not have to be carried.","correct":["A"],"e":"ANO Schedule 10 and JAR Ops 1.125.","img":false},{"s":"10.6. Part-M.","n":"60","q":"The check cycle for aircraft operating to the LAMS schedule, is","a":"50hr, 100hr annual and star inspections.","b":"75hr, 150hr and star inspection.","c":"50hr, 150hr, annual and star inspection.","correct":["C"],"e":"See LAMS FW/1978 or later issue.","img":false},{"s":"10.6. Part-M.","n":"61","q":"A CAA issued capability list gives","a":"details of the operational restrictions placed on an aircraft with a C of A.","b":"details of the scope & extent of a type rated engineers license.","c":"details of the scope & extent to which an organisations approval is given.","correct":["C"],"e":"BCAR A/B8-1 Supplement 2.","img":false},{"s":"10.6. Part-M.","n":"62","q":"Tasks which may be completed without the certification of a CRS is given","a":"in ANO.","b":"in BCARs.","c":"in A N(G)R.","correct":["C"],"e":"For non-EASA aircraft CAP 393 Section 3 AN(G)R Part4 Para 9.","img":false},{"s":"10.6. Part-M.","n":"63","q":"An aircraft operator's MEL","a":"can be more restrictive than the MMEL.","b":"can be less restrictive than the MMEL.","c":"can be more restrictive with certain limitations.","correct":["A"],"e":"NIL.","img":false},{"s":"10.6. Part-M.","n":"64","q":"A service bulletin contains","a":"a list of maintenance tasks to be carried out on a particular aircraft.","b":"information concerning the airworthiness of aircraft and are distributed by the CAA.","c":"a detailed description of a problem and corrective action to be taken.","correct":["C"],"e":"NIL.","img":false},{"s":"10.6. Part-M.","n":"65","q":"Condition Monitoring is","a":"not a preventative process, having neither Hard Time nor On-Conditioning elements.","b":"a combination of Hard Time and Flexi-time working practices.","c":"a preventative process.","correct":["A"],"e":"Condition monitored maintenance allows (duplicated) items to fail so that failure analysis can be carried out.","img":false},{"s":"10.6. Part-M.","n":"66","q":"An allowable deficiency is listed in the","a":"Tech Log and Cabin Defect Log Book.","b":"Tech Log and deferred defect column.","c":"Tech Log and if necessary the deferred defects column.","correct":["C"],"e":"NIL.","img":false},{"s":"10.6. Part-M.","n":"67","q":"An MMEL is compiled by","a":"an air operator and approved by he CAA.","b":"the manufacturer and the AOC company after joint consultation and then approved by the CAA.","c":"the manufacturer and the CAA after joint consultation.","correct":["C"],"e":"NIL.","img":false},{"s":"10.6. Part-M.","n":"68","q":"Flight manual amendments","a":"can be done by the operator.","b":"must have written consent of the CAA.","c":"can be done by the manufacturer.","correct":["B"],"e":"NIL.","img":false},{"s":"10.6. Part-M.","n":"69","q":"Registration of aircraft operated by a company can be found","a":"in the approved maintenance schedule.","b":"in the Company Exposition.","c":"on the AOC.","correct":["C"],"e":"Appendix 1 to JAR-OPS 1.175...page 1-C-3.","img":false},{"s":"10.6. Part-M.","n":"70","q":"An aircraft may fly unregistered","a":"under A conditions.","b":"for export purposes.","c":"under B conditions.","correct":["C"],"e":"ANO Schedule 3.","img":false},{"s":"10.6. Part-M.","n":"71","q":"Foreign Airworthiness Directives, Volume 1 & 2 cover","a":"aircraft above and below 2730Kg MTWA.","b":"aircraft above and below 5700lbs and equipment fitted to them.","c":"aircraft above and below 5700Kg MTWA and equipment fitted to them.","correct":["C"],"e":"AWN 6 para 13.1.","img":false},{"s":"10.6. Part-M.","n":"72","q":"If the second copy of the Tech Log can not be left on the ground, it should","a":"be flown in an approved (by the CAA) box on the aircraft.","b":"be carried by the pilot.","c":"be flown on a different aircraft.","correct":["A"],"e":"BCAR A/B7-8 Para.4.1.","img":false},{"s":"10.6. Part-M.","n":"73","q":"The pilot of an aircraft","a":"cannot sign the 2nd part of a duplicate inspection.","b":"can sign the 2nd part of the duplicate inspection if the aircraft is away from base.","c":"can sign the 2nd part of a duplicate inspection if licensed on that particular type.","correct":["B"],"e":"BCAR A/B6-2 Para.10.3.9.","img":false},{"s":"10.6. Part-M.","n":"74","q":"Aircraft above 5700 kg are weighed","a":"every five years.","b":"two years after manufacture thereafter every five years.","c":"at manufacture then after 2 years then every 5 years after manufacture.","correct":["C"],"e":"BCAR A/B6-4 Para.3.1.1.","img":false},{"s":"10.6. Part-M.","n":"75","q":"Who issues a C of A for export","a":"The CAA - SRG.","b":"The manufacturer.","c":"The Approved Organisation.","correct":["A"],"e":"BCAR A/B3-6 Para.3.1.","img":false},{"s":"10.6. Part-M.","n":"76","q":"CAP 393 is","a":"the ANO and regulations.","b":"Air Operators Certificate.","c":"AWNs.","correct":["A"],"e":"CAP 393 is 'Air Navigation: The Order and the Regulations'.","img":false},{"s":"10.6. Part-M.","n":"77","q":"AWN 3 is","a":"related to engineers personal responsibility when medically unfit.","b":"related to engineers licence type rating.","c":"related to the responsibilities of licensed engineers.","correct":["C"],"e":"AWN 3.","img":false},{"s":"10.6. Part-M.","n":"78","q":"Volume 1 and 2 of FADs","a":"relate to aircraft from countries other then USA and UK.","b":"are published by the CAA.","c":"are published by the FAA.","correct":["C"],"e":"AWN 6 para 13.1.","img":false},{"s":"10.6. Part-M.","n":"79","q":"The minimum number of battery powered megaphones required for an aircraft capable of carrying more than 199 passengers is","a":"3.","b":"5.","c":"7.","correct":["A"],"e":"ANO Sched.4 Scale.","img":false},{"s":"10.6. Part-M.","n":"80","q":"Life jackets not equipped with a whistle are","a":"acceptable for one passenger of a pair.","b":"not acceptable.","c":"acceptable for children under 3 years old.","correct":["C"],"e":"ANO Sched.4 Scale H 2.","img":false},{"s":"10.6. Part-M.","n":"81","q":"Maintenance Manuals in cassette/CDs have the advantage of being easier to","a":"amend.","b":"store.","c":"read.","correct":["A"],"e":"NIL.","img":false},{"s":"10.6. Part-M.","n":"82","q":"It is the responsibility of the person accepting parts for use on an aircraft to ensure that","a":"a green serviceable label is attached.","b":"those parts conform to the required standard and are serviceable.","c":"those parts are designed to the appropriate Authorised Release Certificate.","correct":["B"],"e":"AWN 3.","img":false},{"s":"10.6. Part-M.","n":"83","q":"Mandatory markings for flight instruments, or placards are annotated in the","a":"Aircraft Maintenance Schedule.","b":"Flight manual or Certificate of Airworthiness.","c":"Aircraft Maintenance Manual.","correct":["B"],"e":"Mandatory markings for instruments are in the Flight Manual.","img":false},{"s":"10.6. Part-M.","n":"84","q":"Consumable items such as split pins, nuts, nuts bolts etc are usually identified by a","a":"batch/part number on the containing bag.","b":"batch number on each item.","c":"release note on each item.","correct":["A"],"e":"Consumable items have a batch and part number on the containing bag.","img":false},{"s":"10.6. Part-M.","n":"85","q":"CAP 360 relates to","a":"EASA aircraft only.","b":"crop spraying aircraft only.","c":"Public Transport aircraft.","correct":["C"],"e":"CAP 360 is now obsolete - replaced by JAR-OPS for Commercial Air Transport.","img":false},{"s":"10.6. Part-M.","n":"86","q":"Holding a Licence Without type (LWTR) only affords the holder","a":"automatic company approval.","b":"limited certification ability.","c":"no certification rights.","correct":["C"],"e":"AWN 3 Note 1.","img":false},{"s":"10.6. Part-M.","n":"87","q":"All reports received by the CAA under the MOR scheme are processed by the","a":"EASA.","b":"CAA.","c":"Air Accident Investigation Branch.","correct":["B"],"e":"ANO Art.145 6 to 15.","img":false},{"s":"10.6. Part-M.","n":"88","q":"In respect of an aircraft exceeding 2730kg maximum total mass, a CRS is required","a":"when a component has been replaced even if it is the same component.","b":"when an item of workshop test equipment is submitted for an annual check.","c":"only if component replacement in an aircraft involves a different component.","correct":["A"],"e":"AWN 3 Para 1.2 (e).","img":false},{"s":"10.6. Part-M.","n":"89","q":"The full extent of the certification responsibilities of a licence engineer with regard to the CRS will be found in","a":"AWN 3.","b":"ANO schedule.","c":"BCAR section A.","correct":["A"],"e":"AWN 3.","img":false},{"s":"10.6. Part-M.","n":"90","q":"Vital points identified and included in the maintenance documents","a":"relate to points subject to a duplicate inspection.","b":"relate to areas in which all work must be carried out by a suitably licensed engineer.","c":"identify areas or components subject to timed life.","correct":["A"],"e":"BCAR A/B5-3 Item 3 Para.3.","img":false},{"s":"10.6. Part-M.","n":"91","q":"A Master Minimum Equipment List (MMEL) is","a":"more restrictive than a Minimum Equipment List.","b":"is a list of items that may be inoperative on an aircraft.","c":"originated by the aircraft operator.","correct":["B"],"e":"CAP 549 CAP 396 Chapter 25.","img":false},{"s":"10.6. Part-M.","n":"92","q":"An airline's MEL contains an additional note (M). This indicates a","a":"Mandatory operational restrictions.","b":"Maintenance requirements.","c":"Modified component or system.","correct":["B"],"e":"CAP 396 Chapter 25. CAP 549.","img":false},{"s":"10.6. Part-M.","n":"93","q":"Technical limitations of work and authority with reference to Aircraft Maintenance Engineers are laid down in","a":"BCAR Section L.","b":"Airworthiness Notice 3.","c":"ANO.","correct":["B"],"e":"AWN 3.","img":false},{"s":"10.6. Part-M.","n":"94","q":"An A or C Type rated aircraft maintenance engineer may issue a CRS relating to an associated electrical system within limitations laid down in","a":"BCARs section L.","b":"ANO.","c":"AWN 3.","correct":["C"],"e":"AWN 3.","img":false},{"s":"10.6. Part-M.","n":"95","q":"When completing a Certificate of Maintenance Review, which of the following must be completed","a":"C of A.","b":"CRS.","c":"A maintenance statement in the tech log.","correct":["C"],"e":"A maintenance statement specifies the date of the next SMI due.","img":false},{"s":"10.6. Part-M.","n":"96","q":"An aircraft of less than 2730Kg operating in the private category would normally be maintained I.A.W","a":"the manufactures maintenance schedule.","b":"LAMS.","c":"the owners wishes.","correct":["B"],"e":"See LAMS FW/1978 or later issue.","img":false},{"s":"10.6. Part-M.","n":"97","q":"Foreign AD volume 2 is applicable to aircraft, engines, propellers, and equipment manufactured in","a":"the former USSR.","b":"Europe.","c":"the USA.","correct":["C"],"e":"AWN 6 Para.13.1.","img":false},{"s":"10.6. Part-M.","n":"98","q":"With reference to engineer licensing, aircraft for which type rating can not be obtained are found in","a":"Airworthiness Notice No 10.","b":"BCAR section L.","c":"EASA IR Part-145.","correct":["A"],"e":"AWN 10 Para.14.","img":false},{"s":"10.6. Part-M.","n":"99","q":"The ANO states that the Log Book shall be kept for the aircraft and one for","a":"each engine and VP propeller.","b":"each engine and undercarriage.","c":"its radio and navigation equipment.","correct":["A"],"e":"ANO Art.22 (1).","img":false},{"s":"10.6. Part-M.","n":"100","q":"An airline wishes to fly an aircraft to a contractor within the UK with all the passengers seats removed ready for refurbishment and painting. The flight may be authorised using","a":"A special request procedure to the CAA.","b":"A conditions.","c":"B conditions.","correct":["B"],"e":"BCAR A/B3-8 1.1 b).","img":false},{"s":"10.6. Part-M.","n":"101","q":"Mandatory modification of UK origin are identified by the CAA","a":"AAD.","b":"AAN.","c":"AD number.","correct":["C"],"e":"BCAR A/B5-6, BCAR A/B6-6.","img":false},{"s":"10.6. Part-M.","n":"102","q":"The check cycle for an aircraft is","a":"the same for all aircraft maintained by one operator.","b":"stated in the approved maintenance schedule.","c":"the same for all aircraft of one type.","correct":["B"],"e":"BCAR A/B7-5.","img":false},{"s":"10.6. Part-M.","n":"103","q":"For a simple aircraft the CAA LAMS Schedule may need to be amended by","a":"deleting non application items.","b":"completing the supplementary texts.","c":"rewriting it.","correct":["B"],"e":"See LAMS FW/1978 or later issue.","img":false},{"s":"10.6. Part-M.","n":"104","q":"A CRS is not required on completion of","a":"each check A for aircraft not exceeding 2730Kg MTWA.","b":"each inspection item on the AMS.","c":"a check on the check cycle.","correct":["A"],"e":"See LAMS FW/1978 or later issue.","img":false},{"s":"10.6. Part-M.","n":"105","q":"A CMR must be completed on aircraft exceeding 2730Kg at","a":"periods not exceeding 4 months.","b":"every 4 months.","c":"every 12 months.","correct":["A"],"e":"BCAR A/B6-2 A CMR is carried out and issued normally each 4 months for aircraft exceeding 2730 kg.","img":false},{"s":"10.6. Part-M.","n":"106","q":"A duplicate inspection must be the last","a":"CRS issue.","b":"check before issue of a CRS for the task.","c":"signature after a CRS for the task.","correct":["B"],"e":"BCAR A/B6-2 AWN 3 Para 1.6A.","img":false},{"s":"10.6. Part-M.","n":"107","q":"A maintenance statement is","a":"the approval for a maintenance schedule.","b":"part of the tech log.","c":"used to certify a pre-flight check.","correct":["B"],"e":"BCAR A/B7-8 2.1 (c).","img":false},{"s":"10.6. Part-M.","n":"108","q":"MAMIS lists mandatory inspections and service bulletins of aircraft manufactured in","a":"Europe (not including the UK).","b":"the UK.","c":"USA.","correct":["B"],"e":"AWN 6 para 14.","img":false},{"s":"10.6. Part-M.","n":"109","q":"Guidance with respect to Part-145 and CAA national requirements can be found in","a":"BCAR section A.","b":"CAAIPs.","c":"AWN 14.","correct":["C"],"e":"AWN 14.","img":false},{"s":"10.6. Part-M.","n":"110","q":"An aircraft maintenance engineer licence does not include unlimited certification in NDT testing. Guidance with respect to NDT personnel can be found in","a":"CAP 747.","b":"BCAR section L.","c":"CAAIPs.","correct":["A"],"e":"CAP 747 GR No23.","img":false},{"s":"10.6. Part-M.","n":"111","q":"Information on Air Operators Certification is to be found in ANO","a":"Article 6.","b":"Article 10.","c":"Article 9.","correct":["A"],"e":"ANO Art.6.","img":false},{"s":"10.6. Part-M.","n":"112","q":"An Air Operators Certificate must be issued by the CAA. before an airline can","a":"carry passengers and/or freight for reward.","b":"carry freight for reward.","c":"carry fare paying passengers.","correct":["A"],"e":"ANO Art.6.","img":false},{"s":"10.6. Part-M.","n":"113","q":"An approved certificate certifies that","a":"items are serviceable on delivery.","b":"materials and parts come from an approved source.","c":"materials and parts conform to required standard.","correct":["C"],"e":"An approved certificate certifies that materials or parts conform to a required standard.","img":false},{"s":"10.6. Part-M.","n":"114","q":"B.C.A.R.s","a":"contain minimum requirements to be met.","b":"detail mandatory requirements for aircraft design and construction.","c":"are issued by Ministry of Trade and Industry.","correct":["A"],"e":"See the 'Forward' in any BCAR.","img":false},{"s":"10.6. Part-M.","n":"115","q":"CAAIPs","a":"contain approved inspection procedures.","b":"contain mandatory instructions.","c":"are issued by CAA.","correct":["C"],"e":"CAP 562 is issued by the CAA, are not mandatory and do not contain approved inspection procedures.","img":false},{"s":"10.6. Part-M.","n":"116","q":"A Major Modification","a":"will always require air testing after embodiment.","b":"is approved by an A.A.N.","c":"must be certified in the Modification Record Book.","correct":["B"],"e":"BCAR A/B2-5 Para 2.2.4.","img":false},{"s":"10.6. Part-M.","n":"117","q":"An Approval Authority Reference number","a":"is issued by Ministry of Trade and Industry.","b":"will be of specific form.","c":"must be included on all Approved Certificates.","correct":["B"],"e":"Of the form A I/000/99 (BCAR A8) or UK.145.009 (Part 145).","img":false},{"s":"10.6. Part-M.","n":"118","q":"Technical and Administrative information is officially circulated to L.A.M.E.S. in","a":"AWNs.","b":"CAIPs.","c":"B.C.A.R.s.","correct":["A"],"e":"AWN 1.","img":false},{"s":"10.6. Part-M.","n":"119","q":"A glider being used privately, and not crossing boundaries of countries:","a":"must have a Permit to Fly.","b":"does not need a C of A.","c":"must have a C of A.","correct":["B"],"e":"ANO Art.8 Para.2 (a).","img":false},{"s":"10.6. Part-M.","n":"120","q":"An approved store","a":"is required by every approved organization.","b":"is the responsibility of Quality Assurance Department.","c":"must contain at least a bonded store.","correct":["B"],"e":"The approved store is the responsibility of the chief inspector.","img":false},{"s":"10.6. Part-M.","n":"121","q":"On a duplicate inspection on a helicopter, what checks are carried out","a":"Control system only.","b":"Control system and anything that controls propulsive force.","c":"Propulsive control system only.","correct":["B"],"e":"BCAR A/B6-2 Para.10.","img":false},{"s":"10.6. Part-M.","n":"122","q":"A Certificate of Release to service states that","a":"a task has been carried out in accordance with the ANO.","b":"the aircraft has been maintained to an approved schedule.","c":"an operator has satisfied the CAA of his competence.","correct":["A","C"],"e":"BCAR A/B6-2 Para.8.4.","img":false},{"s":"10.6. Part-M.","n":"123","q":"A CMR is raised after","a":"major overhaul.","b":"scheduled servicing at specified intervals.","c":"defect rectification.","correct":["B"],"e":"BCAR A/B Para.5.1.","img":false},{"s":"10.6. Part-M.","n":"124","q":"Occurrences should be reported to","a":"Department of Trade & Industry.","b":"Chief Inspector of Accidents.","c":"CAA.","correct":["C"],"e":"ANO Art.142.","img":false},{"s":"10.6. Part-M.","n":"125","q":"Compliance with the ANO is restricted to","a":"aircraft and their equipment which are on the UK & Commonwealth Civil Registers.","b":"aircraft and their equipment which are on the UK Civil Register only.","c":"all civil aircraft and their equipment on the International Civil Register.","correct":["B","C"],"e":"The ANO covers all aircraft on the UK civil register.","img":false},{"s":"10.6. Part-M.","n":"126","q":"A quarantine store is a part of an approved store where","a":"aircraft parts are placed, once they have been proven to conform to specification.","b":"aircraft parts are placed, until they have been proven to conform to specification.","c":"aircraft parts are placed, whilst awaiting delivery to the customer.","correct":["B","C"],"e":"A quarantine store holds parts until they are proved to conform to specification.","img":false},{"s":"10.6. Part-M.","n":"127","q":"Which of the following manuals would be referred to when checking the airworthiness directive on a British constructed engine","a":"CAA Additional Directives CAP 473.","b":"FAD Volume 3 CAP 474.","c":"CAP 476 Mandatory Aircraft Modifications and Inspections Summary.","correct":["C"],"e":"BCAR A/B6-6 2.5.","img":false},{"s":"10.6. Part-M.","n":"128","q":"An Airworthiness Directive carried out to an engine of American construction fitted to British-built aircraft below 5700 kg MTWA would be certified in","a":"the Engine Log Book.","b":"the Aircraft Log Book.","c":"the Modification Record Book.","correct":["A"],"e":"ADs on the engine are certified in the engine logbook regardless of origin.","img":false},{"s":"10.6. Part-M.","n":"129","q":"If an Airworthiness Directive has not been complied with within the flying hour limitations given on the directive, what effect would this have on the engine","a":"The aircraft can be certified fit for flight under A conditions of the ANO and continue operation for the period of validity of the certificate.","b":"The engine and thus the aircraft is grounded until the directive has been complied with.","c":"The approved engineer can award an extension to the compliance time to enable the engine to remain in operation.","correct":["B","C"],"e":"BCAR A5-6, Para 1.3.","img":false},{"s":"10.6. Part-M.","n":"130","q":"When related to aeronautical engineering, the term Inspection is defined in the publication","a":"ANO Article 11.","b":"BCAR Section L.","c":"Airworthiness Notice (AWN) 3.","correct":["C"],"e":"AWN 3 1.2 (d).","img":false},{"s":"10.6. Part-M.","n":"131","q":"Mandatory modifications are","a":"modifications which ensure continued airworthiness.","b":"modifications which are approved on an airworthiness approval note.","c":"modifications of an urgent nature.","correct":["A"],"e":"Mandatory modifications ensure continued airworthiness.","img":false},{"s":"10.6. Part-M.","n":"132","q":"An alert bulletin printed by the manufacturer of a British constructed engine is","a":"a recommended modification to the aircraft/engine.","b":"classified as mandatory by the CAA and will be followed by incorporation in the publication Mandatory Aircraft Modification s and Inspection Summary.","c":"classified as mandatory by the manufacturer and must be incorporated before further flight.","correct":["C"],"e":"BCAR A/B6-6.","img":false},{"s":"10.6. Part-M.","n":"133","q":"The information in the ANO is given in the form of","a":"Articles of Law, some of which are further clarified by Schedules.","b":"Chapters, each one dealing with a different aspect of Civil Aviation, these chapters being backed up by the Schedules.","c":"Regulations, each one covering a different aspect of Civil Aviation and as such is mandatory.","correct":["A","C"],"e":"CAP 393.","img":false},{"s":"10.6. Part-M.","n":"134","q":"Air Navigation (General) Regulations are to be found in","a":"CAA Printed Manual CAP 393.","b":"British Civil Airworthiness Requirements Section A.","c":"Airworthiness Requirements CAP 455.","correct":["A"],"e":"CAP 393.","img":false},{"s":"10.6. Part-M.","n":"135","q":"British Civil Airworthiness Requirements","a":"are printed by the CAA and are of an advisory nature.","b":"form the Technical requirements for the design and operation of aircraft and their equipment.","c":"interpret the ANO and form the Technical requirements for the design, construction, operation and maintenance of aircraft and their equipment.","correct":["C"],"e":"See 'General Forward' in any BCAR.","img":false},{"s":"10.6. Part-M.","n":"136","q":"Airworthiness directives for American built engines fitted to aircraft not exceeding 5700 kg would be found in","a":"FAD Volume 3.","b":"FAA Airworthiness Directives Volume 1.","c":"FAA Airworthiness Directives Volume 2.","correct":["B"],"e":"AWN 6.","img":false},{"s":"10.6. Part-M.","n":"137","q":"An airworthiness directive has the identification number 91-10-05 on it. This indicates","a":"the year followed by the bi-weekly period followed by the directive number.","b":"the year followed by the weekly period followed by the directive number.","c":"the chapter followed by the section followed by the subject or directive number in accordance with ATA 100.","correct":["A","C"],"e":"91-10-05 is year - biweekly period - directive number.","img":false},{"s":"10.6. Part-M.","n":"138","q":"Airworthiness Notices are amended by","a":"issue numbers and dates as necessary.","b":"monthly issue numbers.","c":"CAA yellow pages.","correct":["A"],"e":"SEE AWN 1.","img":false},{"s":"10.6. Part-M.","n":"139","q":"An On Condition Inspection involves","a":"an inspection of a component with a view to continued operation if its condition warrants such action.","b":"a programme of inspections used to increase the life of lifed components.","c":"replacement of life expired components for new ones.","correct":["A","C"],"e":"On Condition' means an inspection of a component with a view to continued operation if its condition warrants it.","img":false},{"s":"10.6. Part-M.","n":"140","q":"An airworthiness directive must be complied with","a":"before further flight.","b":"as soon as practicable following receipt of the directive.","c":"within the time or flying hours limitations given on the directive.","correct":["C"],"e":"BCAR A/B6-6.","img":false},{"s":"10.6. Part-M.","n":"141","q":"The term 'inspection' is defined as meaning","a":"correct installation and operation of the task.","b":"correct condition, assembly and functioning of the component or system.","c":"correct assembly and functioning of the components or system.","correct":["B","C"],"e":"AWN 3 1.2 (d).","img":false},{"s":"10.6. Part-M.","n":"142","q":"Information contained in the ANO is","a":"of a legal nature in all sections and is therefore mandatory.","b":"written in compliance of the Civil Aviation Act of 1943 ratifying the ICAO Convention.","c":"of a mandatory nature where safety is concerned.","correct":["A"],"e":"Information in the ANO is of a legal nature in all sections an therefore mandatory.","img":false},{"s":"10.6. Part-M.","n":"143","q":"What documents should be carried when flying an aircraft overseas for the purpose of exportation:","a":"C of A for export, a C of R, and a validation certificate.","b":"C of A for export, a ferry certificate and a permit to fly.","c":"C of A for export, a C of A for Ferry Purposes and a C of R.","correct":["C"],"e":"BCAR A/B3-6.","img":false},{"s":"10.6. Part-M.","n":"144","q":"When there is an overlap of responsibility, how is the CRS signed","a":"Appropriate Type Rated Licensed Aircraft Engineers must each certify the parts appropriate to their license coverage.","b":"An appropriate Type Rated Licensed Aircraft Engineer an a ATPL holder when the aircraft is away from base and the controls are not affected.","c":"Only one appropriate Type Rated Licensed Aircraft Engineer may sign the CRS as he assumes responsibility for the operation, the other engineers must sign the paperwork.","correct":["A","C"],"e":"AWN 3 Para. 1.4c.","img":false},{"s":"10.6. Part-M.","n":"145","q":"Mandatory aircraft modification and inspection summary is divided into","a":"4 parts: aircraft/engines & propellers/radio stations/equipment.","b":"3 parts: aircraft / engines & propellers / radio & equipment.","c":"2 parts: aircraft & equipment/engines & propellers.","correct":["A","B"],"e":"AWN 6.","img":false},{"s":"10.6. Part-M.","n":"146","q":"Mandatory Warning Plaques and symbols","a":"must be displayed on all flights.","b":"need not be displayed if they are incorporated in the flight manual.","c":"must be displayed in the cabin only if they are legible.","correct":["A","C"],"e":"Mandatory warning plaques and symbols must be displayed on all flights.","img":false},{"s":"10.6. Part-M.","n":"147","q":"The responsibilities of licensed engineers for certification of aircraft are laid down in","a":"ANO.","b":"ANO (General) Regulations.","c":"Airworthiness Notice 3.","correct":["C"],"e":"AWN 3.","img":false},{"s":"10.6. Part-M.","n":"148","q":"Maintenance Schedules are issued","a":"in a folder with the operators name on the cover.","b":"with an approval certificate by the CAA.","c":"by the operator with CAA approval.","correct":["C"],"e":"BCAR A/B7-5 2.1.1.","img":false},{"s":"10.6. Part-M.","n":"149","q":"Which of the following must be recorded in a Log Book after a component has been replaced","a":"Serial number, name of manufacturer and number of the licensed engineer carrying out the replacement.","b":"Serial number, part number, name of licensed engineer carrying out the replacement and reason for renewal.","c":"Serial number, part number, reason for removal and the origin and number of the Authorized Release Certificate.","correct":["A","C"],"e":"ANO Sched 6. Name of manufacture, and name of licensed engineer not required.","img":false},{"s":"10.6. Part-M.","n":"150","q":"When nil defects are entered by the captain in a Tech Log","a":"A Certificate of Release to Service must be issued, noting nil defects.","b":"All copies of this entry must be renewed before flight.","c":"One copy is kept on the ground.","correct":["C"],"e":"ANO Art.15 Para 7.","img":false},{"s":"10.6. Part-M.","n":"151","q":"Who can sign a Certificate of Maintenance Review","a":"The Captain of the aircraft if he holds an A.T.P.L.","b":"A Flight Engineer licensed for the aircraft type.","c":"A multi categorized type rate Licensed Engineer or person approved by the CAA.","correct":["C"],"e":"ANO Art.14 Para 3.","img":false},{"s":"10.6. Part-M.","n":"152","q":"Amendments to aircraft manuals","a":"are embodied by the operator and a copy forwarded to the CAA for approval.","b":"must not be done without written consent of the CAA.","c":"can be embodied by the Chief Surveyor or his delegates.","correct":["A","C"],"e":"BCAR A/B 5-3 Para.5.","img":false},{"s":"10.6. Part-M.","n":"153","q":"When is an Airworthiness Approval Note issued","a":"By the CAA to the operator to approve a major modification.","b":"On completion of a test flight for Certificate of Airworthiness.","c":"After renewal of the Certificate of Maintenance Review.","correct":["A","C"],"e":"BCAR A/B2-5 Para 2.2.4.","img":false},{"s":"10.6. Part-M.","n":"154","q":"Above what weight is an Air Operators Certificate required","a":"All aircraft flying for public transport.","b":"3600 kg.","c":"2300 kg.","correct":["A"],"e":"ANO Art.6.","img":false},{"s":"10.6. Part-M.","n":"155","q":"If the operator varies the content of the maintenance schedule, what action must be taken","a":"Amend the Maintenance Schedule.","b":"Await CAA approval before amending the Maintenance Schedule.","c":"Amend the Maintenance Schedule and seek the CAA approval.","correct":["B","C"],"e":"BCAR A/B5-3 Para.5.","img":false},{"s":"10.6. Part-M.","n":"156","q":"Who approves Maintenance Manuals","a":"The Department of Trade and Industry.","b":"The Board of Trade.","c":"The CAA.","correct":["C"],"e":"BCAR A/B5-3 Para.1.2.","img":false},{"s":"10.6. Part-M.","n":"157","q":"The carriage of a Technical Log is mandatory","a":"for all aircraft registered in the U.K. having a Certificate of Airworthiness in either the public transport or aerial work category.","b":"for all aircraft registered in the U.K.","c":"for all aircraft registered in the U.K. on International flights only.","correct":["A","B","C"],"e":"ANO Art.15 Para.1.","img":false},{"s":"10.6. Part-M.","n":"158","q":"If an engine is inhibited. Where is this recorded","a":"Airframe Log Book.","b":"Engine Log Book.","c":"Flight Manual.","correct":["B"],"e":"ANO Art.22.","img":false},{"s":"10.6. Part-M.","n":"159","q":"When extra documents are used for maintenance recovery and are too numerous to list in the aircraft Log Book, what action is taken","a":"Obtain new Log Book and cross refer to the original Log Book.","b":"Enter brief details in Log Book and retain documents.","c":"Enter brief details in the Log Books and cross refer to a work pack.","correct":["C"],"e":"BCAR A/B6-2 Para.11.1.","img":false},{"s":"10.6. Part-M.","n":"160","q":"You are a passenger of an aircraft which sustains major damage facilitating major repair or component replacement. Who would you inform","a":"CAA.","b":"Chief Inspector of Accidents.","c":"Board of Trade.","correct":["B"],"e":"CAP 382 Para 3.3.1.","img":false},{"s":"10.6. Part-M.","n":"161","q":"An Airworthiness Directive carried out to an engine of American construction fitted to British built aircraft below 5700 kg M.T.W\\.A. would be certified in","a":"The Engine Log Book.","b":"The Aircraft Log Book.","c":"The modification record book.","correct":["A"],"e":"Modifications are 'certified' in the engine log book with a CRS. Modification Record Book is not for engines.","img":false},{"s":"10.6. Part-M.","n":"162","q":"The certification requirements for scheduled and non-scheduled mandatory inspections, overhauls and repairs are to be found in","a":"the organization's schedule of approval.","b":"the aircraft maintenance manual.","c":"the approval document to the aircraft maintenance schedule.","correct":["C"],"e":"BCAR A/B7-5 Appendix 1 Para.1.1 (e).","img":false},{"s":"10.6. Part-M.","n":"163","q":"The purpose of the CRS is","a":"to comply with article 15 of the ANO which states that an aircraft must not fly unless it is properly equipped for the intended flight.","b":"to turn a log book or job card entry into a legal document and to ensure that the signatory takes full responsibility for the work done.","c":"to ensure that the log book entry is complete.","correct":["B"],"e":"ANO Art.16.","img":false},{"s":"10.6. Part-M.","n":"164","q":"A hard time engine inspection involves","a":"replacement with a new or overhauled component.","b":"removal of an engine component, it's inspection and refitting.","c":"an in-situ function test.","correct":["A"],"e":"Hard Time' maintenance involves replacement with a new or overhauled component at specific periods of calendar time or flying hours.","img":false},{"s":"10.6. Part-M.","n":"165","q":"Duplicate inspections are","a":"inspections which have to be duplicated but which can finally be certified by one LAE or approved signatory.","b":"inspections certified by one approved signatory or LAE and then certified by a second approved signatory or LAE.","c":"inspections signed by a mechanic and countersigned by an approved signatory or licensed engineer.","correct":["B","C"],"e":"BCAR A/B6-2 Para.10.","img":false},{"s":"10.6. Part-M.","n":"166","q":"If an engine fuel control is disturbed","a":"the whole fuel control system must be inspected again in duplicate.","b":"the part disturbed must be inspected again in duplicate.","c":"the part disturbed must be inspected again.","correct":["B"],"e":"BCAR A/B6-2 10.3.1 Note.","img":false},{"s":"10.6. Part-M.","n":"167","q":"The Certificate of Maintenance Review (CMR) is not required by","a":"any aircraft on the British register.","b":"all aircraft operated under JAR-OPS.","c":"any aircraft not used for transport and aerial work aircraft over 2730kg.","correct":["B","C"],"e":"BCAR A/B6-2 Para.5.1 Note.","img":false},{"s":"10.6. Part-M.","n":"168","q":"Log books are required for","a":"all aircraft on the British register together with one for each engine.","b":"all aircraft on the British register together with one for each engine and variable pitch propeller.","c":"all aircraft on the British register, one for the engines and one for the propellers.","correct":["B","C"],"e":"ANO Art.22.","img":false},{"s":"10.6. Part-M.","n":"169","q":"Aircraft log books","a":"can only be flown in the aircraft to which they relate when the tech log is not available.","b":"are designed to be used in the air for the recording of defects and then to be transferred onto the the tech log.","c":"must never be flown in the aircraft to which they relate.","correct":["A","C"],"e":"Log books must never be flown in the aircraft to which they relate.","img":false},{"s":"10.6. Part-M.","n":"170","q":"An aircraft technical log forms","a":"a permanent history of the aircraft.","b":"a part of the certificate of airworthiness for transport category aircraft.","c":"a day to day history of the aircraft.","correct":["C"],"e":"BCAR A/B7-8.","img":false},{"s":"10.6. Part-M.","n":"171","q":"Log books are initially provided by","a":"the manufacturer.","b":"the C.A.A.","c":"the operator.","correct":["A"],"e":"Log Books are initially provided by the manufacturer because they provide a 'complete' technical history of the aircraft.","img":false},{"s":"10.6. Part-M.","n":"172","q":"You would expect to find information on ground handling of aircraft in the","a":"Flight Manual.","b":"Aircraft Maintenance Manual.","c":"Aircraft Overhaul Manual.","correct":["B"],"e":"ATA 100 Chapters 9 & 10.","img":false},{"s":"10.6. Part-M.","n":"173","q":"A.T.A. Specification No. 100 is","a":"an internationally agreed form of Maintenance Schedule.","b":"a system of numbering chapters and sections of Manuals.","c":"a statement of international airworthiness.","correct":["B"],"e":"See ATA 100 specification.","img":false},{"s":"10.6. Part-M.","n":"174","q":"Where would you find legislation governing Nationality and Registration Marks on U.K. registered aircraft","a":"C.A.A.I.P.","b":"B.C.A.R.","c":"A.N.O.","correct":["C"],"e":"ANO Sched.2 Part B.","img":false},{"s":"10.6. Part-M.","n":"175","q":"A Quarantine Store","a":"holds life controlled items only.","b":"holds materials and parts until proved to conform to specification.","c":"holds parts and materials received from overseas.","correct":["B"],"e":"A quarantine store holds materials and parts until proved to conform to specification.","img":false},{"s":"10.6. Part-M.","n":"176","q":"A bonded Store","a":"holds aeronautical supplies which have failed to conform.","b":"holds aeronautical supplies proved to conform to specification.","c":"holds parts and materials until released by H.M. Customs.","correct":["B","C"],"e":"A bonded store holds aeronautical supplies proved to conform to specification.","img":false},{"s":"10.6. Part-M.","n":"177","q":"A concession is","a":"authority not to embody a modification.","b":"authority for a permanent reduction of a requirement.","c":"authority to accept a limited quantity of parts which may not be strictly in accordance with the relevant drawings or specifications.","correct":["C"],"e":"A concession is authority to accept a limited quantity of parts which may not be strictly in accordance with the relevant drawings or specifications.","img":false},{"s":"10.6. Part-M.","n":"178","q":"Which of the following is typical of the number granted to an approved organization under BCARs","a":"A N/0000/67.","b":"A I/0000/103.","c":"A I/0000/83.","correct":["C"],"e":"A BCAR A8 approval number starts with A I or D A I, followed by a 4-figure approval number, followed by the year the approval was originally granted.","img":false},{"s":"10.6. Part-M.","n":"179","q":"Technical Logs are mandatory for the following groups:","a":"Private plus Special Category.","b":"Transport Category plus private category.","c":"Transport Category plus aerial work category.","correct":["C"],"e":"ANO Art.15 Para.1.","img":false},{"s":"10.6. Part-M.","n":"180","q":"Rectification of defects should be entered in appropriate logs","a":"before expiration of Certificate of Maintenance Review.","b":"immediately reported.","c":"within seven days of expiration of Certificate of Maintenance Review.","correct":["C"],"e":"ANO Art.22 Para.3 (a).","img":false},{"s":"10.6. Part-M.","n":"181","q":"A Certificate of Maintenance Review must be retained for","a":"two years after expiry of period of validity.","b":"two years after date of issue.","c":"six months after date of issue.","correct":["B"],"e":"ANO Art.14 Para.8.","img":false},{"s":"10.6. Part-M.","n":"182","q":"Where would you find inspection and classification of damage and repair","a":"Repair Manual.","b":"Flight Manual.","c":"Maintenance Manual.","correct":["A"],"e":"BCAR A/B7-4 Para.3.","img":false},{"s":"10.6. Part-M.","n":"183","q":"Are C.A.A.I.P.s mandatory","a":"Yes, but only for six months at a time.","b":"Only selected parts which are in B.C.A.R.","c":"No, nothing in C.A.A.I.P. is mandatory.","correct":["C"],"e":"Nothing in CAAIPs or CAIPs are mandatory.","img":false},{"s":"10.6. Part-M.","n":"184","q":"The aircraft captain records the aircraft hours flown and defects in","a":"Aircraft Log Book.","b":"Technical Log.","c":"Maintenance Statement.","correct":["B"],"e":"ANO Art.15 Para.4 and M.A.306.","img":false},{"s":"10.6. Part-M.","n":"185","q":"Air Navigation Regulations are originated by","a":"CAA.","b":"Privy Council.","c":"Department of Trade and Industry.","correct":["B"],"e":"The ANRs (CAP 393 Sections 2 - 8) are written by the Privy Council.","img":false},{"s":"10.6. Part-M.","n":"186","q":"A Technical Log is originated by","a":"Manufacturer.","b":"CAA.","c":"Operator.","correct":["C"],"e":"Technical logs are originated by the operator because they are a 'day-to-day' technical history for a/c in the transport or aerial work categories.","img":false},{"s":"10.6. Part-M.","n":"187","q":"Details of International Aircraft Markings on the U.K. register will be found in","a":"ANO.","b":"Flight Manual and Certificate Organizations.","c":"B.C.A.R.","correct":["A"],"e":"ANO Sched.2 Part B.","img":false},{"s":"10.6. Part-M.","n":"188","q":"When a minor adjustment to a control system has been made away from base, a pilot or flight engineer may sign, if licensed for the type concerned","a":"neither part of the duplicate inspection.","b":"the second part of the duplicate inspection.","c":"both parts of the duplicate inspection.","correct":["B"],"e":"BCAR A/B6-2 Para 10.3.9.","img":false},{"s":"10.6. Part-M.","n":"189","q":"After a modification to an aircraft, what has to be raised","a":"Certificate of Release to Service.","b":"Certificate of Modification.","c":"Certificate of Maintenance Review.","correct":["A"],"e":"ANO Art.16 Para.2.","img":false},{"s":"10.6. Part-M.","n":"190","q":"What work has to be recorded and signed for","a":"Only work involving replacements.","b":"All work carried out.","c":"Only work which entails a duplicate inspection.","correct":["B"],"e":"ANO Art.16 Para.2.","img":false},{"s":"10.6. Part-M.","n":"191","q":"Who can sign the Certificate of Release to Service","a":"A licensed engineer or approved inspector.","b":"Only a licensed engineer.","c":"Anyone who has worked on the particular task.","correct":["A"],"e":"ANO Art.16 Para.11 (b).","img":false},{"s":"10.6. Part-M.","n":"192","q":"What should not be kept in Quarantine or Bonded Store","a":"Engine Spares.","b":"Commercial Supplies.","c":"Aircraft spares.","correct":["B"],"e":"Commercial supplies have no traceability.","img":false},{"s":"10.6. Part-M.","n":"193","q":"Where can information on overhaul and replacement periods be found","a":"Flight Manual.","b":"Technical Log.","c":"Maintenance Manual.","correct":["C"],"e":"ATA 100 Ch.5.","img":false},{"s":"10.6. Part-M.","n":"194","q":"An operator who uses his aircraft for the transportation of cargo must do so under the terms of an","a":"Aerial Application Certificate.","b":"Aerial Dealers Certificate.","c":"Air Operators Certificate.","correct":["C"],"e":"ANO Art.6.","img":false},{"s":"10.6. Part-M.","n":"195","q":"Reportable Occurrences are notified to the","a":"Safety Investigation and Data Department of the Accident Investigation Department of the Government:.","b":"Safety Investigation and Data Department of the CAA.","c":"Safety Investigation and Data Department of the Ministry of Civil Aviation.","correct":["B","C"],"e":"CAP 382 Para 13.","img":false},{"s":"10.6. Part-M.","n":"196","q":"An Alert Service Bulletin is issued by","a":"the Manufacturer, notifying aircraft owners and Maintenance Organizations of an urgent major modification.","b":"the CAA giving notification of a mandatory modification.","c":"the Manufacturer notifying aircraft owners and Maintenance Organizations of a modification affecting aircraft airworthiness.","correct":["C"],"e":"NIL.","img":false},{"s":"10.6. Part-M.","n":"197","q":"Where can information on mandatory life limitations for aircraft parts be found","a":"in the 'Airworthiness Limitations' section of the Maintenance Manual, in Mandatory Modifications and Inspections Summary or in CAA Additional Directions.","b":"in Aircraft Service Bulletins, Technical Log and Aircraft Log Books.","c":"in the Technical Log, in Chapter A6-2 or B.C.A.R. and in the Operations Manual which is CAA Approved.","correct":["A","C"],"e":"BCAR A/B5-3 Para.4.","img":false},{"s":"10.6. Part-M.","n":"198","q":"CAA Approval for a major modification is given on","a":"an Airworthiness Approval Note. ","c":"BCAR section A.","correct":["B"],"e":"See AWN 19.","img":false},{"s":"10.6. Part-M.","n":"279","q":"If a defect is raised in the tech log and deferred","a":"it is transferred to the aircraft log book.","b":"it is left on the tech log page until rectified.","c":"it is transferred to the ADD sheets which form part of the tech log.","correct":["C"],"e":"BCAR A/B 7-8 Para.2.1 (e).","img":false},{"s":"10.6. Part-M.","n":"280","q":"Where would you find details of the tasks that the holder of a private pilot's licence can do on his own aircraft if it has a C of A in the private category","a":"AN(G)R's.","b":"BCAR A8-15.","c":"EASA IR Part-145.","correct":["A"],"e":"CAP 393 AN(G)R Section 3 Part 4 Para.9.","img":false},{"s":"10.6. Part-M.","n":"281","q":"What airworthiness notice applies to propellers used on British registered aircraft","a":"14.","b":"75.","c":"4.","correct":["A","C"],"e":"See AWN 4.","img":false},{"s":"10.6. Part-M.","n":"282","q":"The responsibility to keep and maintain aircraft log books lies with","a":"the owner.","b":"the operator.","c":"the Part-145 organisation maintaining the aircraft.","correct":["B"],"e":"ANO Art.22 Para.5.","img":false},{"s":"10.6. Part-M.","n":"283","q":"The modification record book logs all modifications","a":"to the aircraft only.","b":"to the aircraft, engines and propellers.","c":"only mandatory modifications.","correct":["A"],"e":"BCAR A/B 7-9 Para.1.3.","img":false},{"s":"10.6. Part-M.","n":"284","q":"Aircraft components require overhauls at times stated in the","a":"maintenance schedule.","b":"overhaul manual.","c":"maintenance manual.","correct":["C"],"e":"Chapter 5 ATA.","img":false},{"s":"10.6. Part-M.","n":"285","q":"The overhaul manual gives you information on","a":"how to maintain a component on an aircraft.","b":"overhaul, repair and bench test.","c":"when to overhaul a component.","correct":["B"],"e":"BCAR A/B 7-4 Para 2.","img":false},{"s":"10.6. Part-M.","n":"286","q":"A major mod is carried out. The C of A","a":"is suspended until the mod is carried out and the time is added on to the C of A.","b":"is not effected.","c":"becomes invalid.","correct":["B"],"e":"AWN 9 Issue-4, para 2.3.","img":false},{"s":"10.6. Part-M.","n":"287","q":"To what does Airworthiness Notice 60 refer","a":"Toilet flush motors.","b":"Cabin and toilet fire protection.","c":"Bogus parts.","correct":["B"],"e":"AWN 60 has now been replaced by something else. But download an old copy of Airworthiness Notices.","img":false},{"s":"10.6. Part-M.","n":"288","q":"The minimum requirements for recording a modification are","a":"title page, mod no, description of mod, issue no. and date.","b":"mod. no., issue no. and date.","c":"mod. no. and date.","correct":["B"],"e":"NIL.","img":false},{"s":"10.6. Part-M.","n":"289","q":"What covers engineers responsibilities with reference to a CRS","a":"AWN 3.","b":"BCARs.","c":"ANO.","correct":["A"],"e":"See AWN 3.","img":false},{"s":"10.6. Part-M.","n":"290","q":"The CMR covers all work including","a":"scheduled maintenance, modifications, defects and any deferred defects.","b":"scheduled maintenance, defect rectifications.","c":"scheduled maintenance, modifications.","correct":["A"],"e":"ANO Article 14.","img":false},{"s":"10.6. Part-M.","n":"291","q":"What modifications are recorded in the aircraft log book","a":"Aircraft only.","b":"Engine, propeller and aircraft.","c":"Engine and propeller.","correct":["A"],"e":"Engine and Propeller mods are recorded in their own log books.","img":false},{"s":"10.6. Part-M.","n":"292","q":"When can you amend a Maintenance Schedule","a":"You cant.","b":"You can with written consent of the CAA.","c":"You can amend the maintenance schedule and send a copy to the CAA for approval.","correct":["B","C"],"e":"Section A/B 7-5 3.1.1.","img":false},{"s":"10.6. Part-M.","n":"293","q":"Aircraft which must fly under an AOC are","a":"aircraft registered in the UK.","b":"aircraft in the transport categories.","c":"any aircraft in UK airspace.","correct":["B"],"e":"NIL. 10.7b. Applicable National and International Requirements.","img":false},{"s":"10.6. Part-M.","n":"1","q":"Category 2 autoland with a decision height of 100 ft has a visual line up approach limit of","a":"300 meters.","b":"500 meters.","c":"400 meters.","correct":["A"],"e":"JAR Ops Subpart E Table 6.","img":false},{"s":"10.6. Part-M.","n":"2","q":"An operator's ETOPS approval will lapse if they cease extended range operations for a period of","a":"12 months.","b":"ETOPS approval does not lapse providing the aircraft continues to meet the equipment requirements.","c":"13 month.","correct":["C"],"e":"CAP 513 (ETOPS) Chapter 1 Para. 2.3.","img":false},{"s":"10.6. Part-M.","n":"3","q":"Extended Range Operations (ETOPS) is defined as flight conducted over a route that contains a point further than","a":"one hour's flying time (in still air) at the normal cruise speed from an adequate aerodrome.","b":"one hour's flying time (in still air) at the normal one-engine-inoperative cruise speed from an adequate aerodrome.","c":"three hour's flying time (in still air) at the normal one-engine-inoperative cruise speed from an adequate aerodrome.","correct":["B"],"e":"CAP 513 (ETOPS) Chapter 1 Para. 4.4.","img":false},{"s":"10.6. Part-M.","n":"4","q":"The 'Threshold Time' for an ETOPS approved aircraft is","a":"60 minutes.","b":"90 minutes.","c":"120 minutes.","correct":["A"],"e":"CAP 513 (ETOPS) Chapter 2 Para. 4.12.","img":false},{"s":"10.6. Part-M.","n":"5","q":"Independent and reliable electrical power should be available to an ETOPS aircraft from at least","a":"two sources at all times.","b":"one source at all times.","c":"three sources.","correct":["C"],"e":"CAP 513 (ETOPS) Chapter 2 Para. 2.9.","img":false},{"s":"10.6. Part-M.","n":"6","q":"Any time limited system on an ETOPS aircraft should be available for","a":"the Rule Time minus 15 minutes.","b":"the Rule Time.","c":"the Rule Time plus 15 minutes.","correct":["C"],"e":"CAP 513 (ETOPS) Chapter 2 Para. 2.12.","img":false},{"s":"10.6. Part-M.","n":"7","q":"Before an operator will be approved to fly ETOPS operations, they will normally be required","a":"to have ETOPS experience of not less than 12 months using ETOPS approved aircraft.","b":"to have no opartinal experience of teh type of aircraft providing the aircraft type design and construction is ETOPS approved.","c":"to have operated the aircraft type satisfactorily for a period of not less than 12 months.","correct":["A","C"],"e":"CAP 513 (ETOPS) Chapter 3 Para. 2.","img":false},{"s":"10.6. Part-M.","n":"8","q":"If an operator wishes to apply for ETOPS approval, modifications are most likely to be required of","a":"the aircraft design, MEL, and AMS.","b":"the MEL, AMS and engineer training programme.","c":"the aircraft design, MEL, AMS and engineer training programme.","correct":["C"],"e":"CAP 513 (ETOPS) Chapter 4.","img":false},{"s":"10.6. Part-M.","n":"9","q":"An operator is preparing for ETOPS approval. They will need to make changes to","a":"the aircraft itself, the maintenance procedures and the operational procedures.","b":"the maintennace procedures and the operational procedures, but the aircraft will not need to be altered since all twin engined transport aircrfat are designed and built to ETOPS specifications.","c":"the aircraft itself and the operational procedures, but the maintenance procedures will not need to be altered because the existing Part-145 procedures cover ETOPS operations.","correct":["A","C"],"e":"CAP 513 (ETOPS).","img":false},{"s":"10.6. Part-M.","n":"10","q":"For an aircraft to be ETOPS approved, it must","a":"exceed an MTOW of 5700 kg and carry more than 19 passengers.","b":"carry more than 19 passengers but can be of any weight category.","c":"exceed an MTOW of 5700 kg but does not need to be public transport.","correct":["A","C"],"e":"CAP 513 (ETOPS) Chapter 1 Para 2.1.","img":false},{"s":"10.6. Part-M.","n":"11","q":"An instrument landing system requires","a":"both airborne equipment and airport ground equipment.","b":"airport ground equipment only.","c":"airborne equipment only.","correct":["A"],"e":"JAR-AWO.","img":false},{"s":"10.6. Part-M.","n":"12","q":"A Category 2 landing is","a":"a decision height of 60 M (200ft) or more.","b":"a decision height of 120 M (300ft) or more.","c":"a decision height of 30 M (100ft) or more.","correct":["C"],"e":"JAR-AWO Page 2-1.","img":false},{"s":"10.6. Part-M.","n":"13","q":"A Category 3 landing is","a":"a decision height of 30 M (100ft) or less.","b":"a decision height of 60 M (200ft) or more.","c":"a decision height of 60 M (200ft) or less.","correct":["A"],"e":"JAR-AWO Page 3-1.","img":false},{"s":"10.6. Part-M.","n":"14","q":"The excess ILS deviation light is coloured","a":"amber and continuous.","b":"amber and flashing.","c":"red and flashing.","correct":["A"],"e":"JAR-AWO Page 3-5.","img":false},{"s":"10.6. Part-M.","n":"15","q":"In a landing system, decision height is recognised by","a":"a sonar altimeter.","b":"a barometric servo altimeter.","c":"a radio altimeter.","correct":["C"],"e":"JAR-AWO Page 3-5. 10.8.","img":false},{"s":"10.8.","n":"1","q":"A register of airlines operatoring on an AOC is maintained by the","a":"ICAO.","b":"CAA.","c":"FAA.","correct":["B"],"e":"Nil.","img":false},{"s":"10.8.","n":"2","q":"What category of aircraft are 'break-in' markings required","a":"All public transport aircraft above 2300Kg.","b":"All public transport aircraft above 5700Kg.","c":"All aircraft registered in the UK.","correct":["C"],"e":"Nil.","img":false},{"s":"10.8.","n":"3","q":"A Part-145 approval covers","a":"base maintenance.","b":"the major part of the organisation.","c":"only line maintenance.","correct":["A"],"e":"The part-145 organisation covers ALL of the organisation, and not only line maintenance.","img":false},{"s":"10.8.","n":"4","q":"For UK registered aircraft, components must be","a":"maintained by a part-145 approved organisation.","b":"any appropriately approved organisation.","c":"maintained by a part-145 approved organisation registered in the UK.","correct":["B","C"],"e":"The question is not specific about the 'type' of aircraft (light or heavy).","img":false},{"s":"10.8.","n":"5","q":"Aircraft manufactured abroad, but registered in the UK","a":"can fly with an export C of A.","b":"must have a C of A issued in the UK before it can fly.","c":"can fly with a foreign C of A.","correct":["C"],"e":"It can fly with a foreign C of A providing it is issued a CAA validation certificate.","img":false},{"s":"10.8.","n":"6","q":"To facilitate a repair, a drawing can be taken from","a":"the CAA.","b":"the manufacturer.","c":"a part-145 organisation.","correct":["B"],"e":"The drawing must come from an organisation with Design Approval. Only the manufacturer automatically has that.","img":true},{"s":"10.8.","n":"7","q":"Documents to be carried on a specific aircraft for a specific purpose is given in","a":"BCAR Section A and B.","b":"JAR-OPS.","c":"AOC.","correct":["B"],"e":"Nil.","img":false},{"s":"10.8.","n":"8","q":"Safe operation of the aircraft is the responsibility of the","a":"part-M organisation.","b":"owner.","c":"operator.","correct":["C"],"e":"That's the purpose of the Air Operator's Certificate (AOC).","img":false},{"s":"10.8.","n":"9","q":"The period of validity of a Certificate of Fitness for Flight under 'A' Conditions is","a":"7 days.","b":"1 flight.","c":"2 days.","correct":["A"],"e":"BCAR Section A/B3-8.","img":false},{"s":"10.8.","n":"10","q":"The details of design of a particular aircraft can be found where","a":"The Maintenance Manual.","b":"The Declaration of Design and Performance.","c":"EASA Certification Specification 25.","correct":["B"],"e":"Nil.","img":false},{"s":"10.8.","n":"11","q":"The validity of an EASA permit to fly is","a":"12 months.","b":"7 days.","c":"as stated on the certificate but not exceeding 14 days.","correct":["C"],"e":"AWN 9 Para.5.","img":false}]</script><script>const DATA=JSON.parse(document.getElementById('quiz-data').textContent);const sectionOrder=[],sectionCounts={};DATA.forEach(q=>{if(!(q.s in sectionCounts)){sectionOrder.push(q.s);sectionCounts[q.s]=0}sectionCounts[q.s]++});const state={selectedSections:new Set(sectionOrder),count:20,skipImg:true,quiz:[],idx:0,score:0,answers:[],missedForRetry:[]};const $=id=>document.getElementById(id);function shortSection(s){return s.replace(/^10\.\d+\.\s*/,'').replace(/\.$/,'')}function renderChips(){const c=$('sectionChips');c.innerHTML='';sectionOrder.forEach(sec=>{const d=document.createElement('div');d.className='chip'+(state.selectedSections.has(sec)?' on':'');d.textContent=shortSection(sec)+' ';const n=document.createElement('span');n.className='cnt';n.textContent=sectionCounts[sec];d.appendChild(n);d.onclick=()=>{state.selectedSections.has(sec)?state.selectedSections.delete(sec):state.selectedSections.add(sec);renderChips();updateAvailability()};c.appendChild(d)})}function pool(){return DATA.filter(q=>state.selectedSections.has(q.s)&&!(state.skipImg&&q.img))}function updateAvailability(){const n=pool().length;state.count=Math.min(state.count,Math.max(1,n));$('availNote').textContent='of '+n+' available';$('stepVal').textContent=state.count;$('imgCountNote').textContent=DATA.filter(q=>state.selectedSections.has(q.s)&&q.img).length+' flagged in selection';$('startBtn').disabled=!n;$('startNote').textContent=n?'Ready — '+state.count+' questions.':'Select at least one chapter.'}function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}$('selectAllBtn').onclick=()=>{state.selectedSections=new Set(sectionOrder);renderChips();updateAvailability()};$('selectNoneBtn').onclick=()=>{state.selectedSections=new Set();renderChips();updateAvailability()};$('stepDown').onclick=()=>{state.count=Math.max(1,state.count-5);updateAvailability()};$('stepUp').onclick=()=>{state.count=Math.min(pool().length,state.count+5);updateAvailability()};$('skipImgToggle').onchange=e=>{state.skipImg=e.target.checked;updateAvailability()};$('startBtn').onclick=()=>{state.quiz=shuffle(pool()).slice(0,state.count);state.idx=0;state.score=0;state.answers=[];$('setupScreen').classList.add('hidden');$('quizScreen').classList.remove('hidden');renderQuestion()};function renderQuestion(){const q=state.quiz[state.idx],w=$('qOptions');$('progressLabel').textContent='Question '+(state.idx+1)+' / '+state.quiz.length;$('scoreLabel').textContent='Score: '+state.score;$('progressBar').style.width=(state.idx/state.quiz.length*100)+'%';$('qSectionTag').textContent=shortSection(q.s);$('qText').textContent=q.q+'?';$('qImgNote').classList.toggle('hidden',!q.img);w.innerHTML='';delete w.dataset.locked;['a','b','c'].forEach(L=>{const d=document.createElement('div');d.className='opt';d.dataset.letter=L.toUpperCase();const lab=document.createElement('span');lab.className='lab';lab.textContent=L.toUpperCase();const tx=document.createElement('span');tx.textContent=q[L];d.append(lab,tx);d.onclick=()=>selectOption(d,L.toUpperCase());w.appendChild(d)});$('qFeedback').className='feedback hidden';$('nextBtn').disabled=true}function selectOption(el,letter){const w=$('qOptions');if(w.dataset.locked==='1')return;w.dataset.locked='1';const q=state.quiz[state.idx],ok=q.correct.includes(letter);Array.from(w.children).forEach(o=>{o.classList.add('locked');if(q.correct.includes(o.dataset.letter))o.classList.add('correct');else if(o===el&&!ok)o.classList.add('incorrect');else o.classList.add('dim')});const fb=$('qFeedback');fb.className='feedback '+(ok?'good':'bad');fb.innerHTML='';const b=document.createElement('b');b.textContent=ok?'Correct':'Incorrect';fb.appendChild(b);if(!ok){const x=document.createElement('div');x.textContent='Correct answer: '+q.correct.join(' / ')+') '+q.correct.map(L=>q[L.toLowerCase()]).join(' OR ');fb.appendChild(x)}if(q.e&&q.e!=='NIL'){const x=document.createElement('div');x.textContent=q.e;fb.appendChild(x)}if(ok)state.score++;state.answers.push({q:q,picked:letter,isCorrect:ok});$('scoreLabel').textContent='Score: '+state.score;$('nextBtn').disabled=false}$('nextBtn').onclick=()=>{state.idx++;state.idx>=state.quiz.length?showResults():renderQuestion()};function showResults(){$('quizScreen').classList.add('hidden');$('resultsScreen').classList.remove('hidden');const total=state.answers.length,correct=state.answers.filter(a=>a.isCorrect).length,p=Math.round(correct/total*100);$('scorePct').textContent=p+'%';$('verdictText').innerHTML='<b>'+correct+'/'+total+'</b> correct.';const by={};state.answers.forEach(a=>{if(!by[a.q.s])by[a.q.s]={correct:0,total:0};by[a.q.s].total++;if(a.isCorrect)by[a.q.s].correct++});const bw=$('sectionBreakdown');bw.innerHTML='';Object.keys(by).forEach(s=>{const x=by[s],r=document.createElement('div');r.className='breakdown-row';const n=document.createElement('span');n.className='name';n.textContent=shortSection(s);const bo=document.createElement('span');bo.className='bd-bar-outer';const bi=document.createElement('span');bi.className='bd-bar-inner';bi.style.width=(x.correct/x.total*100)+'%';bo.appendChild(bi);const f=document.createElement('span');f.className='frac';f.textContent=x.correct+'/'+x.total;r.append(n,bo,f);bw.appendChild(r)});const missed=state.answers.filter(a=>!a.isCorrect);state.missedForRetry=missed.map(a=>a.q);$('reviewList').innerHTML='';$('reviewCard').classList.toggle('hidden',!missed.length);$('retryMissedBtn').classList.toggle('hidden',!missed.length);missed.forEach(a=>{const d=document.createElement('div');d.className='review-item';d.innerHTML='<div>'+shortSection(a.q.s)+'</div><div>'+a.q.q+'?</div>';const p=document.createElement('div');p.className='picked';p.textContent='Your answer: '+a.picked+') '+a.q[a.picked.toLowerCase()];const r=document.createElement('div');r.className='right';r.textContent='Correct: '+a.q.correct.join(' / ')+') '+a.q.correct.map(L=>a.q[L.toLowerCase()]).join(' OR ');d.append(p,r);$('reviewList').appendChild(d)})}$('restartBtn').onclick=()=>{$('resultsScreen').classList.add('hidden');$('setupScreen').classList.remove('hidden');renderChips();updateAvailability()};$('retryMissedBtn').onclick=()=>{state.quiz=shuffle(state.missedForRetry);state.idx=0;state.score=0;state.answers=[];$('resultsScreen').classList.add('hidden');$('quizScreen').classList.remove('hidden');renderQuestion()};renderChips();updateAvailability();$('headerSub').textContent=DATA.length+' questions across '+sectionOrder.length+' chapters — pick your chapters and go.';</script></body></html>
